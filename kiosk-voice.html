<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#13503F">
<meta name="robots" content="noindex">
<title>語音點餐</title>
<link rel="icon" type="image/png" sizes="192x192" href="./images/shortcut-icon-192.png?v=20260911">
<link rel="apple-touch-icon" href="./images/shortcut-icon-192.png?v=20260911">
<link rel="shortcut icon" type="image/png" href="./images/shortcut-icon-192.png?v=20260911">
<!--
  店內語音點餐平板（Grok Voice Agent 版）
  ─────────────────────────────────────────
  ‧ 預覽（離線）：直接用瀏覽器開這個檔案，或網址加 ?demo=1 → 模擬對話，不連線、不用麥克風。
  ‧ 正式：放在 Cloudflare Pages（HTTPS）與 pocketbase-order-writer、kiosk-mic-worklet 同一層。
      第一次由店員在平板開：kiosk-voice.html?kioskKey=<KIOSK_VOICE_KEYS 其中一把>
      金鑰存在平板 localStorage，網址上的 key 會自動清掉。
      Pi 位址預設讀 PocketBase settings.linePayServerUrl；要另外指定就加 ?pi=https://xxx
  ‧ XAI_API_KEY 只放在 Pi（/api/kiosk/voice/token 只發 2 分鐘短效 token），平板拿不到永久金鑰。
-->
<style>
:root{
  --green:#13503F;
  --green-deep:#0D3D30;
  --green-soft:#1C6A54;
  --yolk:#FFB000;
  --yolk-light:#FFD45C;
  --yolk-deep:#E68A00;
  --white:#FFFDF5;
  --ink:#23201B;
  --muted:#6B6457;
  --rule:#E3D9C2;
  --red:#D2261C;
  --toast:#C98A4B;
  --toast-crust:#9C5F27;
  --ask-bg:#FFEDB8;
  --ask-ink:#7A4600;
  font-size:clamp(16px,2.5vmin,30px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--green);
  color:var(--white);
  font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Source Han Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:.35rem solid var(--yolk-light);outline-offset:.3rem}
.screen{position:fixed;inset:0;display:none}
.screen.is-active{display:flex}

/* ───── 首頁 ───── */
.home{flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;padding:4vmin 4vmin 6vmin;text-align:center;overflow:hidden}
.home > *{position:relative;z-index:1}
.store-label{font-size:1.15rem;font-weight:700;opacity:.8;margin:0}
.greet{margin:0;font-size:3.3rem;font-weight:900;letter-spacing:.06em;line-height:1.1}
.egg{
  position:relative;border:0;background:none;padding:0;
  width:min(62vmin,600px);aspect-ratio:400/340;
  -webkit-tap-highlight-color:transparent;
}
.egg-white{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 1.3vmin 0 rgba(0,0,0,.2))}
.yolk{
  position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);
  width:58%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,var(--yolk-light) 0,var(--yolk) 46%,var(--yolk-deep) 100%);
  box-shadow:inset -1.2vmin -1.6vmin 0 rgba(200,110,0,.28);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vmin;
  color:var(--ink);
  animation:yolk-call 2.4s ease-in-out infinite;
  transition:transform .12s ease;
}
.yolk::after{content:"";position:absolute;left:20%;top:16%;width:20%;height:13%;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-28deg)}
.egg:active .yolk{transform:translate(-50%,-50%) scale(.95)}
.yolk-icon{width:9vmin;height:9vmin}
.yolk-text{font-size:7.2vmin;font-weight:900;letter-spacing:.08em;line-height:1}
/* kiosk-voice-dinemode-20261107：兩顆蛋（內用、外帶） */
.eggs{display:flex;align-items:center;justify-content:center;gap:5vmin;width:100%}
.eggs .egg{width:min(46vmin,520px)}
.eggs .yolk{width:62%;gap:1.2vmin}
.eggs .yolk-icon{width:8vmin;height:8vmin}
.eggs .yolk-text{font-size:8.2vmin;letter-spacing:.08em;margin-right:-.08em}
.eggs .egg + .egg .yolk{animation-delay:1.2s}
@keyframes yolk-call{
  0%,100%{box-shadow:inset -1.2vmin -1.6vmin 0 rgba(200,110,0,.28),0 0 0 0 rgba(255,176,0,.55)}
  50%{box-shadow:inset -1.2vmin -1.6vmin 0 rgba(200,110,0,.28),0 0 0 3.2vmin rgba(255,176,0,0)}
}
.steps{list-style:none;margin:1vmin 0 0;padding:0;display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap;justify-content:center}
.steps li{display:flex;align-items:center;gap:.55rem;font-size:1.45rem;font-weight:800}
.steps li + li::before{content:"";width:2.4rem;border-top:.28rem dotted rgba(255,253,245,.55);margin-right:.8rem}
.step-no{display:inline-flex;align-items:center;justify-content:center;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--white);color:var(--green);font-size:1.25rem;font-weight:900}
.record-notice{margin:0;font-size:1.05rem;font-weight:700;opacity:.8}
.record-notice[hidden]{display:none}
/* kiosk-voice-micui-20261108：首頁的麥克風狀態 */
.mic-status{position:relative;z-index:2;margin:0;max-width:80vw;font-size:.95rem;font-weight:700;display:inline-flex;align-items:center;gap:.6em}
.mic-status:empty{display:none}
.mic-text{opacity:.75}
.mic-status.is-warn{color:var(--yolk);cursor:pointer}
.mic-status[data-wired="1"] .mic-text{opacity:1;color:var(--yolk)}
.mic-status.is-warn .mic-text{opacity:1;text-decoration:underline dotted;text-underline-offset:.25em}
/* kiosk-voice-led-20261108：LED 指示燈（外接綠、內建紅、不知道灰）：中間亮點＋外圈暈光 */
.mic-led{flex:none;position:relative;width:1.1em;height:1.1em;border-radius:50%}
.mic-led::after{content:"";position:absolute;left:22%;top:14%;width:38%;height:30%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.95),rgba(255,255,255,0) 70%)}
.mic-led.is-ext{background:radial-gradient(circle at 40% 38%,#f3fff6 0,#9dffc0 14%,#2fe27a 38%,#0d9c48 70%,#05542a 100%);
  box-shadow:0 0 .2em .08em rgba(190,255,210,.95),0 0 .75em .3em rgba(60,255,140,.7),0 0 1.7em .7em rgba(60,255,140,.32),inset 0 -.08em .15em rgba(0,60,25,.6)}
.mic-led.is-int{background:radial-gradient(circle at 40% 38%,#fff3f0 0,#ffb3a6 14%,#ff4a34 38%,#c4150a 70%,#6b0703 100%);
  box-shadow:0 0 .2em .08em rgba(255,200,185,.95),0 0 .75em .3em rgba(255,70,45,.7),0 0 1.7em .7em rgba(255,50,30,.34),inset 0 -.08em .15em rgba(70,0,0,.6)}
.mic-led.is-off{background:radial-gradient(circle at 40% 38%,#ffffff 0,#d5d8dc 16%,#8d949b 50%,#4a5056 100%);
  box-shadow:0 0 .35em .05em rgba(255,255,255,.18),inset 0 -.08em .15em rgba(0,0,0,.45)}
body.is-paused .record-notice{display:none}
.home > .home-status{position:absolute;right:2.2vmin;top:1.6vmin;z-index:1;font-size:.8rem;opacity:.6;margin:0}
.paused-msg{white-space:pre-line;display:none;margin:0;max-width:46rem;font-size:2.3rem;font-weight:900;line-height:1.35;color:var(--yolk)}
body.is-paused .paused-msg{display:block}
body.is-paused .steps{display:none}
body.is-paused .egg{filter:grayscale(.85);opacity:.5;pointer-events:none}
body.is-paused .yolk{animation:none}
.decor{position:absolute;z-index:0;pointer-events:none}
.decor-toast{left:-3vmin;bottom:-5vmin;width:26vmin;transform:rotate(-14deg)}
.decor-cup{right:-1vmin;bottom:-2vmin;width:22vmin}
/* kiosk-voice-exit-20261110：店員關閉點餐畫面：同時按住左下角吐司和右下角咖啡杯 2 秒 */
.home > .staff-hot{position:absolute;bottom:0;z-index:2;width:22vmin;height:22vmin;touch-action:none;-webkit-touch-callout:none}
.home > .staff-hot-l{left:0}
.home > .staff-hot-r{right:0}
.decor{transition:filter .25s}
#screen-home.hot-l .decor-toast,#screen-home.hot-r .decor-cup{filter:brightness(1.2) drop-shadow(0 0 2.2vmin var(--yolk))}
.staff-panel{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:4vmin;background:rgba(13,61,48,.82)}
.staff-panel.is-open{display:flex}
.staff-box{background:var(--green-deep);border:.35rem solid var(--yolk);border-radius:1.6rem;padding:2.4rem 2.8rem;max-width:44rem;text-align:center;box-shadow:0 2vmin 6vmin rgba(0,0,0,.35)}
.staff-box h2{margin:0 0 .8rem;font-size:2rem;font-weight:900;color:var(--yolk)}
.staff-box p{margin:0 0 1.6rem;font-size:1.2rem;font-weight:700;line-height:1.55;white-space:pre-line}
.staff-actions{display:flex;gap:1.2rem;justify-content:center;flex-wrap:wrap}
.staff-actions .btn{min-width:12rem}
/* kiosk-voice-power-20261111：關閉點餐畫面（左）、關機（右）、取消（下面一排） */
.staff-main .btn{min-width:14rem;flex:1 1 0}
.btn-power{background:var(--red);color:var(--white);box-shadow:0 .7vmin 0 #8E1710}
.btn-power:active{transform:translateY(.5vmin);box-shadow:0 .2vmin 0 #8E1710}
.staff-sub{margin-top:1.2rem}
.staff-sub .btn{min-width:14rem}
.pin-head h2{margin-bottom:.2rem}
.pin-head .pin-sub{margin:0 0 1rem;font-size:1.3rem;color:rgba(255,253,245,.85)}
@media (orientation:landscape){ .staff-pin .pin-head{grid-area:t} }
/* kiosk-voice-exitpin-20261111：店員密碼鍵盤 */
.staff-pin[hidden],.staff-menu[hidden]{display:none}
.pin-dots{display:flex;justify-content:center;gap:1rem;min-height:3rem;margin:0 0 .6rem;font-size:2.4rem;line-height:3rem;color:var(--yolk);letter-spacing:.1em}
.pin-dots .pin-empty{color:rgba(255,253,245,.35);font-size:1.4rem}
.pin-msg{min-height:1.6em;margin:0 0 1rem !important;font-size:1.15rem !important}
.pin-msg.is-bad{color:#FF8A80}
.pin-pad{display:grid;grid-template-columns:repeat(3,6.4rem);gap:1rem;justify-content:center;margin:0 0 1.4rem}
.pin-pad button{height:5.2rem;border:0;border-radius:1rem;background:var(--white);color:var(--ink);font-size:2.4rem;font-weight:900;box-shadow:0 .6vmin 0 var(--rule);touch-action:manipulation}
.pin-pad button:active{transform:translateY(.4vmin);box-shadow:0 .2vmin 0 var(--rule)}
.pin-pad button.pin-fn{background:var(--green-soft);color:var(--white);font-size:1.4rem;box-shadow:0 .6vmin 0 var(--green)}
.pin-pad button:disabled,.staff-pin .btn:disabled{opacity:.4}
.staff-box.is-shake{animation:pin-shake .35s}
@keyframes pin-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.2rem)}75%{transform:translateX(1.2rem)}}
@media (orientation:landscape){   /* 橫放：數字鍵放右邊，高度才放得下 */
  .staff-box.is-pin{max-width:none}
  .staff-pin:not([hidden]){display:grid;grid-template-columns:minmax(14rem,18rem) auto;grid-template-areas:"t pad" "d pad" "m pad" "a pad";column-gap:3rem;align-items:center;align-content:center}
  .staff-pin h2{grid-area:t}
  .staff-pin .pin-dots{grid-area:d}
  .staff-pin .pin-msg{grid-area:m}
  .staff-pin .pin-pad{grid-area:pad;margin:0}
  .staff-pin .staff-actions{grid-area:a;flex-direction:column;align-items:stretch}
}

/* ───── 點餐中 ───── */
.order{
  display:none;
  grid-template-columns:minmax(0,37fr) minmax(0,63fr);
  grid-template-rows:minmax(0,1fr) auto;
  grid-template-areas:"talk slip" "actions slip";
  gap:2.6vmin 3vmin;padding:3vmin;
}
.order.is-active{display:grid}
.talk{grid-area:talk;display:flex;flex-direction:column;gap:2.2vmin;min-height:0;overflow:hidden}
.status{
  align-self:flex-start;display:inline-flex;align-items:center;gap:.7rem;
  padding:.5rem 1.3rem .5rem .6rem;border-radius:999px;background:var(--green-deep);
  font-size:1.55rem;font-weight:900;
}
.status-dot{position:relative;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--yolk);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.status-dot svg{width:1.5rem;height:1.5rem}
.status[data-state="listening"] .status-dot::after{content:"";position:absolute;inset:0;border-radius:50%;border:.3rem solid var(--yolk);animation:ping 1.3s ease-out infinite}
.status[data-state="speaking"] .status-dot{background:var(--white)}
.status[data-state="thinking"] .status-dot,.status[data-state="connecting"] .status-dot{background:var(--green-soft);color:var(--white)}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(1.8);opacity:0}}
.clerk{display:flex;gap:1.2rem;align-items:flex-start}
.clerk-face{flex:none;width:4.2rem;height:4.2rem;border-radius:50%;background:radial-gradient(circle at 34% 30%,var(--yolk-light),var(--yolk) 55%,var(--yolk-deep));display:flex;align-items:center;justify-content:center}
.clerk-face svg{width:2.6rem;height:2.6rem}
.bubble{
  position:relative;flex:1;min-width:0;background:var(--white);color:var(--ink);
  border-radius:1.4rem;padding:1.1rem 1.4rem 1.2rem;
  font-size:1.8rem;font-weight:800;line-height:1.45;min-height:7.5rem;
}
.bubble::before{content:"";position:absolute;left:-.9rem;top:1.3rem;border:.6rem solid transparent;border-right:.9rem solid var(--white);border-left:0}
.bubble-who{display:block;font-size:1rem;font-weight:800;color:var(--muted);margin-bottom:.2rem}
.heard{margin:0;font-size:1.35rem;font-weight:600;line-height:1.5;color:rgba(255,253,245,.86);padding-left:5.4rem;min-height:2rem;word-break:break-all;
  flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}   /* kiosk-voice-voices-20261107：字多可以捲，不會被按鈕蓋住 */
.heard::-webkit-scrollbar{display:none}
.heard.is-long{font-size:1.15rem;line-height:1.45}
.heard.is-longer{font-size:1rem;line-height:1.4}
.heard{min-height:4.4em}
.clerk{flex:0 1 auto;min-height:0}
.bubble{overflow:hidden}
@media (min-aspect-ratio:1/1) and (max-width:900px){   /* 小平板橫放：左邊比較窄，臉和字縮小，「您說」用整個寬度 */
  .order{grid-template-columns:minmax(0,41fr) minmax(0,59fr)}
  .clerk{gap:.7rem}
  .clerk-face{width:3rem;height:3rem}
  .clerk-face svg{width:1.9rem;height:1.9rem}
  .bubble{font-size:1.45rem;padding:.75rem 1rem .85rem;min-height:0}
  .bubble::before{top:1rem}
  .heard{padding-left:0;font-size:1.2rem}
  .status{font-size:1.3rem}
}
.bubble.is-long{font-size:1.5rem}
.bubble.is-longer{font-size:1.3rem;line-height:1.4}
.heard strong{font-weight:900;color:var(--white);margin-right:.4rem}
.actions{grid-area:actions;display:grid;gap:1.6vmin}
.btn{border:0;border-radius:1.2rem;min-height:5rem;padding:.6rem 1rem;font-size:1.9rem;font-weight:900;letter-spacing:.06em}
.btn-done{background:var(--yolk);color:var(--ink);box-shadow:0 .7vmin 0 var(--yolk-deep)}
.btn-done:active{transform:translateY(.5vmin);box-shadow:0 .2vmin 0 var(--yolk-deep)}
.btn-cancel{background:transparent;color:var(--white);border:.3rem solid rgba(255,253,245,.55);min-height:4.2rem;font-size:1.5rem}
.btn-cancel.is-confirm{background:var(--red);border-color:var(--red)}
.mode-actions{display:none;grid-template-columns:1fr 1fr;gap:1.6vmin}
.mode-actions .btn{min-height:6rem;font-size:2.4rem}
.order.is-asking-mode .mode-actions{display:grid}
.order.is-asking-mode #btn-done{display:none}
.slip-mode{display:inline-block;margin-left:.8rem;padding:.1rem .7rem;border-radius:.5rem;background:var(--green);color:var(--white);font-size:1.1rem;letter-spacing:.1em;vertical-align:middle}
.slip-mode[hidden]{display:none}

/* 點餐單（紙條） */
.slip{
  grid-area:slip;position:relative;display:flex;flex-direction:column;min-height:0;
  background:var(--white);color:var(--ink);
  border-radius:.8rem .8rem 0 0;box-shadow:0 1.1vmin 0 rgba(0,0,0,.18);
  margin-bottom:1.2rem;
}
.slip::after{
  content:"";position:absolute;left:0;right:0;bottom:-1.1rem;height:1.2rem;
  background:linear-gradient(135deg,var(--white) 50%,transparent 50%) 0 0/1.4rem 1.2rem repeat-x,
             linear-gradient(225deg,var(--white) 50%,transparent 50%) 0 0/1.4rem 1.2rem repeat-x;
}
.slip-title{display:flex;justify-content:space-between;align-items:baseline;padding:1.1rem 1.6rem .4rem}
.slip-title h2{margin:0;font-size:1.6rem;font-weight:900;letter-spacing:.2em}
.slip-count{font-size:1.2rem;font-weight:700;color:var(--muted)}
.cols{display:grid;grid-template-columns:3.4rem minmax(0,1fr) 3.6rem 6.6rem;column-gap:.8rem;align-items:start}
.slip-head{padding:.5rem 1.6rem .6rem;border-bottom:.22rem solid var(--ink);font-size:1.1rem;font-weight:800;color:var(--muted)}
.slip-head .c-qty{text-align:center}
.slip-head .c-amt{text-align:right}
.rows{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.row{padding:1.05rem 1.6rem;border-bottom:.16rem dashed var(--rule)}
.row.is-new{animation:row-in 1.8s ease-out}
@keyframes row-in{0%{background:#FFE39A}100%{background:transparent}}
.r-no{font-size:1.6rem;font-weight:800;color:var(--muted);line-height:1.35}
.r-name{font-size:1.95rem;font-weight:900;line-height:1.3;word-break:break-all}
.r-opts{margin-top:.25rem;font-size:1.2rem;font-weight:700;color:var(--muted);line-height:1.45}
.r-ask{display:inline-block;margin-top:.45rem;padding:.12rem .7rem;border-radius:.5rem;background:var(--ask-bg);color:var(--ask-ink);font-size:1.15rem;font-weight:900}
.r-qty{font-size:1.95rem;font-weight:900;text-align:center;line-height:1.3}
.r-amt{font-size:1.95rem;font-weight:900;text-align:right;color:var(--red);line-height:1.3;font-variant-numeric:tabular-nums}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;color:var(--muted);text-align:center;padding:2rem}
.empty svg{width:7rem;height:6rem;opacity:.9}
.empty p{margin:0;font-size:1.55rem;font-weight:800;line-height:1.5}
.slip-foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.6rem 1.1rem;border-top:.45rem double var(--ink)}
.total-label{font-size:2.1rem;font-weight:900;letter-spacing:.2em}
.total{font-size:4.4rem;font-weight:900;color:var(--red);line-height:1;font-variant-numeric:tabular-nums}
.total small{font-size:.5em;margin-right:.1em}

/* ───── 點好了 ───── */
.done{display:none;grid-template-columns:minmax(0,42fr) minmax(0,58fr);grid-template-areas:"msg slip";gap:3vmin;padding:4vmin}
.done.is-active{display:grid}
.done-msg{grid-area:msg;display:flex;flex-direction:column;justify-content:center;gap:2.4vmin}
.done-msg h2{margin:0;font-size:3.6rem;font-weight:900;letter-spacing:.06em}
.done-total{margin:0;font-size:2rem;font-weight:800}
.done-total b{display:block;font-size:6.2rem;line-height:1;color:var(--yolk);font-variant-numeric:tabular-nums}
.done-go{margin:0;font-size:2.4rem;font-weight:900;line-height:1.35}
.done-actions{display:flex;flex-wrap:wrap;gap:1rem}
.done-actions .btn{min-width:13rem}
.done-actions .btn[hidden]{display:none}
.done-no{margin:0;font-size:2rem;font-weight:800}
.done-no b{display:block;font-size:8rem;line-height:.95;color:var(--yolk);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.done.has-no .done-msg{gap:1.6vmin}
.done.has-no .done-msg h2{font-size:2.6rem}
.done.has-no .done-no b{font-size:7rem}
.done.has-no .done-total{font-size:2.2rem}
.done.has-no .done-total b{display:inline;margin-left:.5rem;font-size:3.2rem;color:var(--white)}
.done.has-no .done-go{font-size:2.1rem}
.done-count{margin:0;font-size:1.1rem;opacity:.75}
.done .slip{grid-area:slip}
.done .r-name,.done .r-qty,.done .r-amt{font-size:1.6rem}

/* ───── 錯誤 ───── */
.error{flex-direction:column;align-items:center;justify-content:center;gap:2.4vmin;padding:6vmin;text-align:center}
.error h2{margin:0;font-size:3rem;font-weight:900}
.error-why{margin:0;font-size:1.6rem;font-weight:700;opacity:.85}
.error-do{margin:0;font-size:2.3rem;font-weight:900;color:var(--yolk)}
.error-diag{margin:0;font-size:1rem;opacity:.7}
.error-diag:empty{display:none}
/* 完整指示（唯讀）：manage「語音點餐」→ 查看完整指示 */
.prompt-view{flex-direction:column;gap:1.4rem;padding:2rem max(1rem,4vmin) 3rem;overflow-y:auto;background:var(--green-deep)}
.prompt-view h2{margin:0;font-size:1.8rem;font-weight:900}
.prompt-meta{margin:0;font-size:1rem;line-height:1.7;opacity:.85;white-space:pre-line}
.prompt-view h3{margin:.6rem 0 0;font-size:1.2rem;font-weight:900;color:var(--yolk)}
.prompt-view pre{margin:0;padding:1.2rem 1.4rem;border-radius:.9rem;background:var(--white);color:var(--ink);font:inherit;font-size:1rem;line-height:1.75;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.error .btn{min-width:15rem;margin-top:1vmin}

.demo-badge{display:none;position:fixed;left:50%;top:1.4vmin;transform:translateX(-50%);z-index:50;background:var(--yolk);color:var(--ink);font-size:.95rem;font-weight:900;padding:.3rem 1rem;border-radius:999px;box-shadow:0 .3rem 0 rgba(0,0,0,.2)}
body.is-demo #screen-home.is-active ~ .demo-badge{display:block}
.demo-chip{display:none;margin-left:.8rem;padding:.2rem .7rem;border-radius:999px;background:var(--yolk);color:var(--ink);font-size:.9rem;font-weight:900;vertical-align:middle}
body.is-demo .demo-chip{display:inline-block}
.talk-top{display:flex;align-items:center;flex-wrap:wrap;gap:.6rem}

/* 直立平板 */
@media (max-aspect-ratio:1/1){
  .order{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"talk" "slip" "actions"}
  .actions{grid-template-columns:2fr 1fr}
  .btn-cancel{min-height:5rem}
  .done{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"msg" "slip"}
  .egg{width:min(78vmin,600px)}
  .yolk-text{font-size:8.6vmin}
  .eggs .egg{width:min(46vmin,520px)}
  .eggs .yolk-text{font-size:8.2vmin}
  .greet{font-size:3.8rem}
  .steps{flex-direction:column;align-items:flex-start;gap:1rem;margin-top:2vmin}
  .steps li{font-size:1.6rem}
  .steps li + li::before{display:none}
  .step-no{width:2.5rem;height:2.5rem;font-size:1.35rem}
  .decor-toast{width:30vmin}
  .decor-cup{width:26vmin}
}
/* kiosk-voice-phone-20261107：手機（直放寬 600 以下、或橫放高 500 以下）：字、按鈕、點餐單都縮小 */
@media (max-width:600px),(max-height:500px){
  .order{gap:2vmin 2.4vmin;padding:2.4vmin 3vmin}
  .talk{gap:1.6vmin}
  .status{font-size:1.1rem;gap:.5rem;padding:.3rem .9rem .3rem .35rem}
  .status-dot{width:1.9rem;height:1.9rem}
  .status-dot svg{width:1.1rem;height:1.1rem}
  .clerk{gap:.65rem}
  .clerk-face{width:2.7rem;height:2.7rem}
  .clerk-face svg{width:1.7rem;height:1.7rem}
  .bubble{font-size:1.2rem;min-height:0;padding:.55rem .85rem .65rem;border-radius:1rem}
  .bubble::before{top:.8rem}
  .bubble-who{font-size:.8rem}
  .bubble.is-long{font-size:1.1rem}
  .bubble.is-longer{font-size:1rem}
  .heard{padding-left:0;font-size:1rem;min-height:2.9em}
  .heard.is-long{font-size:.95rem}
  .heard.is-longer{font-size:.9rem}
  .slip{margin-bottom:.9rem;border-radius:.6rem .6rem 0 0}
  .slip::after{bottom:-.8rem;height:.9rem;background-size:1rem .9rem}
  .slip-title{padding:.6rem 1rem .2rem}
  .slip-title h2{font-size:1.2rem}
  .slip-count{font-size:.95rem}
  .slip-mode{font-size:.85rem;margin-left:.5rem}
  .cols{grid-template-columns:2rem minmax(0,1fr) 2.2rem 4.2rem;column-gap:.5rem}
  .slip-head{padding:.3rem 1rem .4rem;font-size:.85rem;border-bottom-width:.16rem}
  .row{padding:.55rem 1rem}
  .r-no{font-size:1.05rem}
  .r-name,.r-qty,.r-amt,.done .r-name,.done .r-qty,.done .r-amt{font-size:1.2rem}
  .r-opts{font-size:.9rem}
  .r-ask{font-size:.85rem}
  .empty{gap:.5rem;padding:1rem}
  .empty svg{width:4rem;height:3.4rem}
  .empty p{font-size:1rem}
  .slip-foot{padding:.5rem 1rem .6rem;border-top-width:.35rem}
  .total-label{font-size:1.3rem}
  .total{font-size:2.5rem}
  .btn{min-height:3.4rem;font-size:1.35rem;border-radius:.9rem}
  .btn-cancel{min-height:3.4rem}
  .actions{gap:2vmin}
  .done{gap:2.4vmin;padding:3vmin 4vmin}
  .done-msg{gap:1.2vmin}
  .done-msg h2{font-size:2rem}
  .done-total{font-size:1.2rem}
  .done-total b{font-size:3.2rem}
  .done-go{font-size:1.4rem}
  .done-no{font-size:1.2rem}
  .done-no b{font-size:4.2rem}
  .done.has-no .done-msg h2{font-size:1.6rem}
  .done.has-no .done-no b{font-size:4rem}
  .done.has-no .done-total{font-size:1.2rem}
  .done.has-no .done-total b{font-size:1.8rem}
  .done.has-no .done-go{font-size:1.25rem}
  .done-actions .btn{min-width:9rem}
  .done-count{font-size:.9rem}
  .error h2{font-size:2rem}
  .error-why{font-size:1.15rem}
  .error-do{font-size:1.5rem}
  .error .btn{min-width:11rem}
}
@media (max-aspect-ratio:1/1) and (max-width:600px){   /* 手機直放：對話區最多佔 4 成，點餐單一定看得到 */
  .talk{max-height:40vh}
  .actions{grid-template-columns:3fr 2fr}
  .btn{letter-spacing:.02em}
  .done-msg{justify-content:flex-start}
}
@media (min-aspect-ratio:1/1) and (max-width:900px){   /* 小平板橫放：完成畫面的點餐單比較窄，餐點名稱不要被擠成直的 */
  .cols{grid-template-columns:2.4rem minmax(0,1fr) 2.6rem 4.8rem;column-gap:.6rem}
  .done .r-name,.done .r-qty,.done .r-amt{font-size:1.35rem}
  .done-msg h2{font-size:2.6rem}
  .done-total b{font-size:4.4rem}
  .done-go{font-size:1.8rem}
}
@media (prefers-reduced-motion:reduce){
  .yolk,.status[data-state="listening"] .status-dot::after,.row.is-new{animation:none}
}
</style>
</head>
<body>

<!-- 首頁 -->
<section id="screen-home" class="screen home is-active" aria-label="選內用或外帶，開始點餐">
  <p id="store-label" class="store-label" hidden></p>
  <h1 id="greet" class="greet">早安！</h1>
  <div class="eggs">
    <button id="btn-dinein" class="egg" type="button" aria-label="內用">
      <svg class="egg-white" viewBox="0 0 400 340" aria-hidden="true">
        <path fill="#FFFDF5" d="M196 10c52-3 98 14 132 40 40 30 62 62 66 104 4 40-10 70-30 98-24 34-62 66-116 76-48 9-96 6-138-12C66 300 30 270 14 228 0 190 4 150 22 116 40 82 66 54 102 34 132 18 162 12 196 10z"/>
      </svg>
      <span class="yolk">
        <svg class="yolk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 2.5v8"/><path d="M4.5 2.5v5a2.5 2.5 0 0 0 5 0v-5"/><path d="M7 10.5v11"/><path d="M17 21.5V2.5c-2.2 1.2-3.5 3.8-3.5 7v3.5H17"/></svg>
        <span class="yolk-text">內用</span>
      </span>
    </button>
    <button id="btn-takeout" class="egg" type="button" aria-label="外帶">
      <svg class="egg-white" viewBox="0 0 400 340" aria-hidden="true">
        <path fill="#FFFDF5" d="M196 10c52-3 98 14 132 40 40 30 62 62 66 104 4 40-10 70-30 98-24 34-62 66-116 76-48 9-96 6-138-12C66 300 30 270 14 228 0 190 4 150 22 116 40 82 66 54 102 34 132 18 162 12 196 10z"/>
      </svg>
      <span class="yolk">
        <svg class="yolk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 12.2a1.5 1.5 0 0 1-1.5 1.3H7.7a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8"/></svg>
        <span class="yolk-text">外帶</span>
      </span>
    </button>
  </div>
  <p id="paused-msg" class="paused-msg" role="status"></p>
  <ol class="steps">
    <li><span class="step-no">1</span><span class="step-text">選內用或外帶</span></li>
    <li><span class="step-no">2</span><span class="step-text">說出想吃的餐點</span></li>
    <li><span class="step-no">3</span><span class="step-text">到櫃台結帳</span></li>
  </ol>
  <p id="record-notice" class="record-notice" hidden></p>
  <p id="mic-status" class="mic-status" role="status"></p>
  <p id="home-status" class="home-status"></p>
  <svg class="decor decor-toast" viewBox="0 0 200 200" aria-hidden="true">
    <path fill="#9C5F27" d="M38 178V86C14 80 8 56 20 38 34 16 66 8 100 8s66 8 80 30c12 18 6 42-18 48v92z"/>
    <path fill="#F2D19A" d="M52 166V80c-18-6-22-22-14-34 10-16 34-24 62-24s52 8 62 24c8 12 4 28-14 34v86z"/>
    <ellipse cx="100" cy="108" rx="34" ry="30" fill="#FFFDF5"/>
    <circle cx="102" cy="106" r="15" fill="#FFB000"/>
  </svg>
  <svg class="decor decor-cup" viewBox="0 0 200 200" aria-hidden="true">
    <path d="M70 34c-8 10 8 18 0 30M100 26c-8 12 8 20 0 34M130 34c-8 10 8 18 0 30" fill="none" stroke="#FFFDF5" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <ellipse cx="100" cy="176" rx="82" ry="16" fill="#0D3D30"/>
    <path fill="#FFFDF5" d="M36 80h128l-12 84c-2 10-10 16-20 16H68c-10 0-18-6-20-16z"/>
    <path d="M162 98c26-4 34 32 4 44" fill="none" stroke="#FFFDF5" stroke-width="12" stroke-linecap="round"/>
    <path fill="#C98A4B" d="M42 80h116l-2 14H44z"/>
  </svg>
  <!-- kiosk-voice-exit-20261110：店員關閉點餐畫面（同時按住吐司和咖啡杯 2 秒） -->
  <div id="staff-hot-l" class="staff-hot staff-hot-l" aria-hidden="true"></div>
  <div id="staff-hot-r" class="staff-hot staff-hot-r" aria-hidden="true"></div>
</section>

<!-- kiosk-voice-exit-20261110：店員選單 -->
<div id="staff-panel" class="staff-panel" role="dialog" aria-modal="true" aria-label="店員：關閉點餐畫面">
  <div class="staff-box">
    <div id="staff-menu" class="staff-menu">
    <h2>要關閉點餐畫面，還是關機？</h2>
    <p id="staff-msg"></p>
    <div class="staff-actions staff-main">
      <button id="staff-close" class="btn btn-done" type="button">關閉點餐畫面</button>
      <button id="staff-power" class="btn btn-power" type="button">關機</button>
    </div>
    <div class="staff-actions staff-sub">
      <button id="staff-cancel" class="btn btn-cancel" type="button">取消</button>
    </div>
    </div>
    <!-- kiosk-voice-exitpin-20261111：店員密碼 -->
    <div id="staff-pin" class="staff-pin" hidden>
      <div class="pin-head"><h2 id="pin-title">關閉點餐畫面</h2><p class="pin-sub">請輸入店員密碼</p></div>
      <div id="pin-dots" class="pin-dots" aria-live="polite"></div>
      <p id="pin-msg" class="pin-msg"></p>
      <div id="pin-pad" class="pin-pad">
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
        <button type="button" data-k="clear" class="pin-fn">清除</button><button type="button" data-k="0">0</button><button type="button" data-k="back" class="pin-fn" aria-label="刪一個字">⌫</button>
      </div>
      <div class="staff-actions">
        <button id="pin-ok" class="btn btn-done" type="button">確認</button>
        <button id="pin-cancel" class="btn btn-cancel" type="button">取消</button>
      </div>
    </div>
  </div>
</div>

<!-- 點餐中 -->
<section id="screen-order" class="screen order" aria-label="點餐中">
  <div class="talk">
    <div class="talk-top">
      <div id="status" class="status" data-state="connecting" role="status" aria-live="polite">
        <span class="status-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/></svg></span>
        <span id="status-text">接通中…</span>
      </div>
      <span class="demo-chip">預覽模擬</span>
    </div>
    <div class="clerk">
      <span class="clerk-face" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none" stroke="#23201B" stroke-width="3" stroke-linecap="round"><path d="M13 16v2M27 16v2"/><path d="M12 25c4 5 12 5 16 0"/></svg></span>
      <p id="agent-text" class="bubble" aria-live="polite"><span class="bubble-who">點餐員</span><span id="agent-line">正在幫您接通點餐員，請稍等…</span></p>
    </div>
    <p id="user-text" class="heard"></p>
  </div>
  <div class="actions">
    <div class="mode-actions">
      <button id="btn-mode-dinein" class="btn btn-done" type="button">內用</button>
      <button id="btn-mode-takeout" class="btn btn-done" type="button">外帶</button>
    </div>
    <button id="btn-done" class="btn btn-done" type="button">我點好了</button>
    <button id="btn-cancel" class="btn btn-cancel" type="button">取消重來</button>
  </div>
  <div class="slip" aria-label="點餐單">
    <div class="slip-title"><h2>點餐單<span id="order-mode" class="slip-mode" hidden></span></h2><span id="order-count" class="slip-count"></span></div>
    <div class="slip-head cols"><span>項次</span><span>餐點</span><span class="c-qty">數量</span><span class="c-amt">金額</span></div>
    <div id="order-rows" class="rows"></div>
    <div class="slip-foot"><span class="total-label">總價</span><span id="order-total" class="total"><small>$</small>0</span></div>
  </div>
</section>

<!-- 點好了 -->
<section id="screen-done" class="screen done" aria-label="點餐完成">
  <div class="done-msg">
    <h2 id="done-title">點好了！</h2>
    <p id="done-no" class="done-no" hidden>您的號碼<b id="done-no-val">000</b></p>
    <p class="done-total">總共<b id="done-total">$0</b></p>
    <p id="done-go" class="done-go">請到櫃台結帳，<br>謝謝您！</p>
    <div class="done-actions">
      <button id="btn-retry" class="btn btn-done" type="button" hidden>再送一次</button>
      <button id="btn-home" class="btn btn-done" type="button">回到首頁</button>
    </div>
    <p id="done-count" class="done-count"></p>
  </div>
  <div class="slip" aria-label="點餐單">
    <div class="slip-title"><h2>點餐單</h2><span id="done-items" class="slip-count"></span></div>
    <div class="slip-head cols"><span>項次</span><span>餐點</span><span class="c-qty">數量</span><span class="c-amt">金額</span></div>
    <div id="done-rows" class="rows"></div>
  </div>
</section>

<!-- 無法使用 -->
<section id="screen-error" class="screen error" aria-label="暫時無法使用">
  <h2>語音點餐暫時不能用</h2>
  <p id="error-why" class="error-why"></p>
  <p id="error-diag" class="error-diag"></p>
  <p class="error-do">請直接跟櫃台店員點餐，謝謝！</p>
  <button id="btn-error-home" class="btn btn-done" type="button">回到首頁</button>
</section>

<!-- 完整指示（唯讀）：kiosk-voice.html?view=prompt -->
<section id="screen-prompt" class="screen prompt-view" aria-label="完整指示">
  <h2>語音點餐員目前的完整指示（唯讀）</h2>
  <p id="prompt-meta" class="prompt-meta">讀取中…</p>
  <h3>送給 Grok 的指示</h3>
  <pre id="prompt-text"></pre>
  <h3>加強辨識詞（前 100 個，另外會加上 Pi 的別名字典）</h3>
  <pre id="prompt-terms"></pre>
</section>

<div id="demo-badge" class="demo-badge">預覽模式：模擬對話，不會連線</div>

<script>
(function () {
  'use strict';

  /* ═════════ 設定 ═════════ */
  var CONFIG = {
    // ── 下面標 ★ 的欄位是「預設值」：manage →「🎙️ 語音點餐」存的設定（PocketBase settings.kioskVoice）會蓋過它們，
    //    每位客人按「開始點餐」時重新讀一次；manage 留空的欄位就用這裡的預設。（Grok 網頁上的 instruction / welcome message 不會用在這個頁面）
    enabled: true,                    // ★ 總開關
    pausedText: '語音點餐暫停中，請到櫃台點餐，謝謝！',   // ★ 暫停時首頁顯示
    greeting: '你好！想吃什麼呢？直接說餐點名稱就可以喔。',   // ★（kiosk-voice-smooth-20261107：早安改由 greetingMorning 說）
    greetingMorning: '早安！想吃什麼呢？',   // ★ 早上的開場白（kiosk-voice-smooth-20261107）；空白＝整天都用 greeting
    morningUntil: '10:00',            // ★ 早上到幾點（之前用 greetingMorning、首頁大字「早安！」；之後用 greeting、「你好！」）
    storeFacts: '店名：元氣早午餐（善化中山店）；地址：台南市善化區中山路208-2號；營業時間：週一到週六約 06:00 到 13:00，週日公休。',   // ★
    recommend: '',                    // ★ 顧客問「有什麼推薦」時才說
    extraRules: '',                   // ★ 想多交代點餐員的事，例如：「今天鮮奶茶暫停供應」；沒有就留空
    keyterms: [],                     // ★ 加強辨識詞（新品名稱、常被聽錯的字），排在菜單名稱前面
    // ── 送單：點好了 → 進 POS / admin / manage（店內付款、廚房出單，和桌邊自助平板同一條流程）──
    submitOrders: true,               // ★ false = 試營運：只顯示點餐單，請顧客到櫃台口述
    submitIncomplete: false,          // ★ 顧客沒說「點好了」就結束（時間到、走開、斷線）時，已點的餐點也送單（備註「請和客人確認」）
    homeSteps: ['選內用或外帶', '說出想吃的餐點', '到櫃台結帳'],   // ★ 首頁三個步驟（kiosk-voice-dinemode-20261107：第 1 步改成選內用或外帶）

      '3. 果醬（沙拉、草莓…）用菜單預設，不要問口味；顧客點的時候說了口味（例如「奶油的果醬燒餅」「巧克力抹醬丹尼酥」），口味一定要放進 selections；點完才說要換，用 update_item 換。結果有 missing 時，只問第一個，白話問：missing 裡有 ask 就照 ask 問（例如「要加蛋嗎？」，預設的選項一定要說到）；沒有 ask：套餐飲料→「飲料要大杯奶茶，還是換別的？」；溫度→「冰的還是溫的？」；容量→「大杯還是中杯？」。顧客回答後呼叫 update_item 改「問的那一項」（line 用那一項的項次），selections 用 options 裡的原文；顧客只說「好」「要」「可以」就用 default。顧客回答後又接著點新的餐點（例如「好啊，再一個拼盤」），要分開：答案用 update_item 給問的那一項，新的餐點用 add_items，絕對不要把答案放進新餐點的 selections。加蛋只問要不要：顧客說要，就用 default（菜單預設的蛋），不要再問要哪一種蛋；顧客自己說半熟蛋、散蛋、太陽蛋才照他說的。有蛋有肉的鐵板麵、拼盤本來就有蛋（用菜單預設的蛋），不要問要不要加蛋，也不要問要哪一種蛋；無蛋無肉的鐵板麵照 ask 問要不要加蛋或加肉。結果有 answered_previous，表示系統已經幫那一題記好，不要再問；有 egg_kept 照它說的處理。',
      '4. 結果有 ask（顧客還沒說是哪一種，例如套餐／單點、辣卡／原卡、有蛋有肉／無蛋無肉）時，照 ask 的原句問，其他一個字都不要加：不要加餐點名稱、不要解釋（例如不要說「有蛋有肉的里肌」「無蛋無肉的肉醬」），不要自己決定，也絕對不可以把 candidates 全部加入；顧客選好後，只用他選的那一個 name 再呼叫 add_items。顧客明確說「兩種都要」「各一個」才分別加。sold_out 時說「不好意思，這個今天賣完了」，請顧客換別的。',
      '5. 顧客改口一律在同一項上改，不要新增一項，也不要寫進備註：改成有蛋有肉、無蛋無肉、套餐或單點，用 update_item 的 name 填這幾個字；換別的餐點也用 update_item 的 name；改數量、不要某樣用 update_item 或 remove_item（line 是畫面上的項次）。',
      '5-1. 結果有 auto_upgraded 或 meat_added 時，用一句短話告訴顧客，例如「幫您改成套餐，比較划算」「另外加一片肉，○○元」（加肉要多收的錢照 meat_added 念）。結果有 unmatched 時，那幾個字沒有對應的選項：顧客的回答請換成 options 裡的原文再送一次；真的是備註（例如不要醬）就放 note。',
      CONFIG.allowSwap ? '' : '5-2. 顧客說要「換」（例如果醬換奶酥、漢堡換蝸牛堡、蛋換全熟、生菜換番茄）：不要自己先說能不能換，照顧客的原話放進那一項的 selections（例如「果醬換奶酥」），系統會判斷：菜單上有的選項會直接選好（看結果的 selected，不用多說）；結果有 not_allowed 時，照它的 message 跟顧客說，其他時候都不要提換不換。「不要某樣」（例如不要醬、不要生菜）照舊寫在 note。',   // kiosk-voice-noswap-20261108
      customRulesText(),   // kiosk-voice-rules-20261108
      CONFIG.askDineMode
        ? '6. 顧客說「這樣就好」「沒有了」「好了」，或系統告訴你顧客按了「我點好了」：還不知道內用還是外帶，就直接問「請問內用還是外帶？」，這時先不要呼叫工具；顧客回答（或系統說顧客按了按鈕）後馬上呼叫 finish_order，dine_mode 填「內用」或「外帶」。已經知道內用外帶就直接呼叫 finish_order。回傳 pending 就先把沒確認的問完；回傳 need_dine_mode 就問「請問內用還是外帶？」。'
        : '6. 顧客說「這樣就好」「沒有了」「好了」，或系統告訴你顧客按了「我點好了」，馬上呼叫 finish_order。回傳 pending 就先把沒確認的問完。',
      '6-1. finish_order 成功後只說一句（開頭的「好的」呼叫前已經說過）：有 order_no 就說「總共○○元，您的號碼是○○號，' + CONFIG.closingText + '」；沒有 order_no 就說「總共○○元，' + CONFIG.closingText + '」；submitted 是 false 就說「不好意思，訂單沒有送出成功，請到櫃台告訴店員您的餐點」；number_pending 是 true（號碼還在產生）就說「總共○○元，號碼會顯示在螢幕上，' + CONFIG.closingText + '」；trial 是 true 就說「總共○○元，請到櫃台告訴店員您的餐點，謝謝您！」。金額用 order_total，號碼用 order_no。',
      '6-2. 系統說點餐時間到了，就照系統說的收尾，不要再問新的問題。',
      '7. 可以說的錢只有這幾種：加料要多收的錢（照 ask、meat_added）、combo_offer 可以省多少、套餐的「飲料折5元」「超過30元補差價」（照【套餐】或 set_includes）、最後總共多少（照 finish_order）。其他價錢一律不說，也不要自己加總。',
      '7-1. add_items 找不到餐點時，不要直接說「我們沒有」：照 message 先從【今日菜單】找發音最像的問「請問是○○嗎？」（例如 高麗滷肉餅→高鈣乳酪餅、木樹芽→苜蓿芽）；問過還是不對，才請顧客看旁邊的菜單看板換別的。結果有 heard_as 是系統照錯字表改好的，不用跟顧客說。',
      '8. 聽不清楚就說「不好意思，可以再說一次嗎？」；顧客講台語也盡量聽懂，用華語回答。',
      '8-0. 顧客問「套餐有什麼」「套餐跟單點差在哪」：只說套餐多附的飲料，照【套餐】或 search_menu 結果的 set_includes 說，例如「套餐有附一杯飲料，飲料折五元」「套餐附一杯大杯錫蘭奶茶，可以換別的飲料，超過三十元要補差價」；不要念食材，也不要說餐點價錢。',
      '8-1. 顧客問某道餐點裡面有什麼、有沒有某樣食材（例如洋蔥、香菜、辣不辣）：先用 search_menu 查那一道，只照結果的 contents 回答。問「有沒有○○」：contents 有寫到就說「有喔」，沒寫到就只說「沒有喔」，不要多說別的。問「裡面有什麼」：白話念出主要食材，例如「裡面有炸雞腿、生菜、番茄和酸黃瓜醬」。contents 是「菜單沒有寫食材」，就說「這個要麻煩問一下櫃台店員」。絕對不要用一般常識猜。顧客提到過敏，最後加一句「如果會過敏，請再跟櫃台確認一下」。結果有 notice（注意事項）時：顧客問能不能吃、有沒有要注意的，或提到懷孕、哺乳、吃藥、肝腎、過敏，就用一句話照 notice 提醒；只問裡面有什麼就不用念。顧客說不要某樣食材（例如不要洋蔥），寫在那一項的 note。',
      '9. 店名、地址、營業時間只用【店家】寫的回答；不知道的就說「這個要麻煩問一下櫃台店員」，不要猜。',
      '10. 顧客身體不舒服、有緊急狀況或要客訴，請他直接找櫃台店員。',
      '【不可以】推銷、一次介紹很多餐點（combo_offer 問一次不算推銷）；答應付款、外送、折扣或免費（單點和飲料做成套餐是菜單上的價錢，不算折扣）；聊和點餐無關的事（簡短帶回點餐）。',
      CONFIG.storeFacts ? '【店家】' + CONFIG.storeFacts : '',
      CONFIG.recommend ? '【推薦】顧客問「有什麼推薦」「什麼好吃」時才介紹，一次最多說兩樣：' + CONFIG.recommend : '',
      CONFIG.extraRules ? '【今天特別注意】' + CONFIG.extraRules + (/更換|不能換|不可以換|不能改|不可更換/.test(CONFIG.extraRules) ? '（「不能更換」是指菜單上沒有的換法；菜單上本來就有的選項，例如果醬換奶酥、漢堡換蝸牛堡、蛋換全熟，照常放進 selections，系統會判斷）' : '') : '',   // kiosk-voice-heard-20261110
      setRulesText(),
      LITE ? '【今日菜單】（精簡測試：不列出品名，照顧客說的名稱傳給 add_items，系統會對菜單）' : '【今日菜單】（品名；飲料列出杯型；沒列出的就是今天沒有）',
      LITE ? '' : order.map(function (c) { return '〔' + c + '〕' + cats[c].join('、'); }).join('\n')

  function customRulesText() {   // kiosk-voice-rules-20261108

      '【客製化規則】（有寫「只限」的只用在那幾道）\n' + list.map(CustomRules.forPrompt).join('\n');

  function buildKeyterms(aliasData) {
    // kiosk-voice-typo-20261106：最多 100 個。以前照分類排，前面幾類就把 100 個佔滿（高鈣乳酪餅、苜蓿芽蔬菜吐司排不進去）
    //   → 1) manage 設的加強辨識詞 2) 錯字表裡最常被聽錯的字（苜蓿芽、高鈣乳酪餅、亞朵包…）3) 各分類輪流放品名
    var pri = ['套餐', '漢堡', '蝸牛堡', '蛋餅', '燒餅', '吐司', '厚片', '其它', '飲品', '單點', '食材'];
    var rank = function (c) { c = c || ''; for (var i = 0; i < pri.length; i++) if (c.indexOf(pri[i]) !== -1) return i; return pri.length; };
    var out = [], seen = {};
    function add(t) { t = String(t || '').trim(); if (!t || t.length > 50 || seen[t]) return; seen[t] = 1; out.push(t); }
    (CONFIG.keyterms || []).forEach(add);
    hardTerms().slice(0, 30).forEach(add);
    var cats = {}, order = [];
    Menu.active.forEach(function (it) {
      var c = it.category || '其他', t = speakName(String(it.name).replace(/^單點-/, '').replace(/^\d+號/, '').replace(/(套餐|單點)$/, '').replace(/\(.*?\)/g, '')).replace(/\s+/g, '');
      if (!cats[c]) { cats[c] = []; order.push(c); }
      if (cats[c].indexOf(t) === -1) cats[c].push(t);
    });
    order.sort(function (a, b) { return rank(a) - rank(b); });
    for (var round = 0; out.length < 100; round++) {
      var any = false;
      order.forEach(function (c) { if (cats[c][round] !== undefined) { any = true; add(cats[c][round]); } });
      if (!any) break;
    }
    parseAliases(aliasData).forEach(function (r) { add(r[0]); });
    return out.slice(0, 100);
  }
  function hardTerms() {   // 錯字表裡被聽錯最多次的正確字，而且菜單上真的有
    var names = Menu.active.map(function (it) { return norm(it.name); }), count = {}, text = {};
    typoRows().forEach(function (r) {
      if (r.to.length < 2 || /^\d/.test(r.to) || !names.some(function (n) { return n.indexOf(r.to) !== -1; })) return;
      count[r.to] = (count[r.to] || 0) + 1;
    });
    return Object.keys(count).sort(function (a, b) { return count[b] - count[a] || b.length - a.length; });
  }
  function dayVoice(now) {   // kiosk-voice-dayvoice-20261106：今天（平板的日期，和營業時段判斷一樣）指定的聲音，沒指定回 ''

  var Rec = {
    rec: null, dest: null, chunks: [], done: null, mime: '',
    start: function (io) {
      this.rec = null; this.dest = null; this.chunks = []; this.done = null; this.mime = '';
      if (!window.MediaRecorder || !io.ctx.createMediaStreamDestination) return;
      try {
        var self = this, mime = '';
        ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/mp4', 'audio/webm'].some(function (m) {
          if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) { mime = m; return true; } return false;
        });
        this.dest = io.ctx.createMediaStreamDestination();
        io.source.connect(this.dest);
        var opts = { audioBitsPerSecond: 24000 };
        if (mime) opts.mimeType = mime;
        var r = new MediaRecorder(this.dest.stream, opts);
        this.mime = r.mimeType || mime || 'audio/webm';
        r.ondataavailable = function (e) { if (e.data && e.data.size) self.chunks.push(e.data); };
        this.done = new Promise(function (res) {
          r.onstop = function () { res(self.chunks.length ? new Blob(self.chunks, { type: self.mime.split(';')[0] }) : null); };
          r.onerror = function () { res(null); };
        });
        r.start(1000);
        this.rec = r;
      } catch (e) { console.warn('[kiosk] recorder unavailable', e); this.rec = null; this.dest = null; this.done = null; }
    },
    stop: function () {   // 回傳這次錄音（沒有錄就是 null）；錄完把 dest 拿掉，下一位客人重新開始
      var r = this.rec, done = this.done;
      this.rec = null; this.dest = null; this.done = null;
      if (r && r.state !== 'inactive') { try { r.stop(); } catch (_) {} }
      return done ? Promise.race([done, new Promise(function (res) { setTimeout(function () { res(null); }, 4000); })]) : Promise.resolve(null);
    }

  /* ═════════ 對話紀錄（每位客人一份，結束後連同錄音上傳 Pi）═════════ */
  var Log = {
    cur: null, turn: 0,
    begin: function () {

      this.cur = { id: ymd(now).replace(/-/g, '') + '-' + ('0' + now.getHours()).slice(-2) + ('0' + now.getMinutes()).slice(-2) + ('0' + now.getSeconds()).slice(-2) + '-' + Math.random().toString(36).slice(2, 6),
        t0: Date.now(), startedAt: now.toISOString(), events: [], users: {}, agentLogged: false };
    },
    add: function (role, text, extra) {

      if (extra) Object.keys(extra).forEach(function (k) { e[k] = extra[k]; });
      this.cur.events.push(e);

      var e = this.cur.users[key];

          e.t = at; e.heard_at = Math.round((Date.now() - this.cur.t0) / 100) / 10;

  function warmSubmit() {   // kiosk-voice-fastfinish-20261105：送單要用的模組和匿名登入先準備好
    if (DEMO || !dynImport || !CONFIG.submitOrders) return;
    try { dynImport(CONFIG.writerModule).catch(function () {}); firebaseUser().catch(function () {}); } catch (_) {}
  }
  var StartMode = '';   // kiosk-voice-dinemode-20261107：首頁按的是內用還是外帶
  function startWith(mode) {
    if (closedReason()) { renderPaused(); return; }   // kiosk-voice-hours-20261108：總開關、店休、時段外
    if (Session.active) return;
    StartMode = mode;
    keepAwake();
    warmSubmit();
    if (DEMO) startDemo(); else startLive();
  }
  Staff.init();   // kiosk-voice-exit-20261110
  $('btn-dinein').addEventListener('click', function () { startWith('dinein'); });
  $('btn-takeout').addEventListener('click', function () { startWith('takeout'); });
  $('btn-done').addEventListener('click', userPressedDone);
  $('btn-cancel').addEventListener('click', function () {
    var b = $('btn-cancel');
    if (!cancelArmed) {
      b.textContent = '再按一次確定取消'; b.classList.add('is-confirm');
      cancelArmed = later(4000, function () { cancelArmed = 0; b.textContent = '取消重來'; b.classList.remove('is-confirm'); });
      return;
    }
    clearTimeout(cancelArmed); cancelArmed = 0; b.textContent = '取消重來'; b.classList.remove('is-confirm');
    Session.endHint = 'cancelled';
    goHome();
  });
  $('btn-home').addEventListener('click', goHome);
  $('btn-retry').addEventListener('click', function () { submitOrder().catch(function () {}); });
  $('btn-mode-dinein').addEventListener('click', function () { pressDineMode('dinein'); });
  $('btn-mode-takeout').addEventListener('click', function () { pressDineMode('takeout'); });
  $('btn-error-home').addEventListener('click', goHome);

  var wakeLock = null;
  function keepAwake() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request && !wakeLock) {
        navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; l.addEventListener('release', function () { wakeLock = null; }); }).catch(function () {});
      }
    } catch (_) {}
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') keepAwake(); });

  /* ═════════ 啟動 ═════════ */
  if (CONFIG.storeLabel) { $('store-label').textContent = CONFIG.storeLabel; $('store-label').hidden = false; }
  setGreeting();
  renderOrder();
  if (window.speechSynthesis) { pickVoice(); try { window.speechSynthesis.onvoiceschanged = pickVoice; } catch (_) {} }
  if (VIEW_PROMPT) {
    showScreen('screen-prompt');
    if (DEMO) { setMenu(DEMO_MENU, null); renderPromptView(); }
    else loadLiveMenu().then(renderPromptView);
  } else if (DEMO) {
    document.body.classList.add('is-demo');
    setMenu(DEMO_MENU, null);
    homeStatus();
  } else {
    homeStatus();
    loadLiveMenu();
    setInterval(function () { if ($('screen-home').classList.contains('is-active')) loadLiveMenu(); }, CONFIG.menuRefreshMs);
    keepAwake();
  }

  // 測試用
  window.__kiosk = { runTool: runTool, findItem: findItem, setMenu: setMenu, Order: Order, Menu: Menu, buildInstructions: buildInstructions, buildKeyterms: buildKeyterms, fixTypos: fixTypos, applyRemoteDict: applyRemoteDict, Dict: Dict, sessionUpdate: sessionUpdate, CONFIG: CONFIG, Session: Session, goHome: goHome, showError: showError, goDone: goDone, Submit: Submit, buildOrderData: buildOrderData, speakName: speakName, submitOrder: submitOrder, businessWindow: businessWindow, applyVoiceSettings: applyVoiceSettings, transcriptDishes: transcriptDishes, showTypos: showTypos, Tm: Tm, Hold: Hold, Ack: Ack, setUser: setUser, setAgent: setAgent, demoStop: demoStop, startWith: startWith, beginSessionUI: beginSessionUI, Greet: Greet, Pre: Pre, onReady: onReady, onMicChunk: onMicChunk, needsTalk: needsTalk, quietAfterTools: quietAfterTools, startLive: startLive, flavorFromWords: flavorFromWords, onResponseDone: onResponseDone, dayVoice: dayVoice, sessionVoice: sessionVoice, refreshSettings: refreshSettings, Remote: Remote, renderPromptView: renderPromptView, choiceAsk: choiceAsk, Turn: Turn, resetOffers: resetOffers, Offers: Offers, Pending: Pending, closingLine: closingLine, closingResponse: closingResponse, pressDineMode: pressDineMode, handleEvent: handleEvent, Log: Log, Rec: Rec, AudioIO: AudioIO, Jank: Jank, netText: netText, currentGreeting: currentGreeting, isMorning: isMorning, setGreeting: setGreeting, userPressedDone: userPressedDone, isSwap: isSwap, stripSwaps: stripSwaps, pinHash: pinHash, pinMatches: pinMatches, forAgent: forAgent, plainNext: plainNext, Fan: Fan, Wait: Wait, WaitLearn: WaitLearn, Staff: Staff, rescueChoice: rescueChoice, heardAssign: heardAssign, menuSwap: menuSwap, takeSwaps: takeSwaps, mergeEarlierDrink: mergeEarlierDrink, lineInfo: lineInfo, calcLine: calcLine, optionDish: optionDish, nameOption: nameOption, styleLabel: styleLabel, CustomRules: CustomRules, verdict: verdict, screenBag: screenBag, pickExternalMic: pickExternalMic, refreshMicStatus: refreshMicStatus, closedReason: closedReason, renderPaused: renderPaused, setSettings: function (v) { Settings = v; }, tick: tick, teardown: teardown, requestResponse: requestResponse, renderHomeText: renderHomeText };
})();
</script>
