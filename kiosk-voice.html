<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#13503F">
<meta name="robots" content="noindex">
<title>語音點餐</title>
<!--
  店內語音點餐平板（Grok Voice Agent 版）
  ─────────────────────────────────────────
  ‧ 預覽（離線）：直接用瀏覽器開這個檔案，或網址加 ?demo=1 → 模擬對話，不連線、不用麥克風。
  ‧ 正式：放在 Cloudflare Pages（HTTPS）與 pocketbase-order-writer、kiosk-mic-worklet 同一層。
      第一次由店員在平板開：kiosk-voice.html?kioskKey=<KIOSK_VOICE_KEYS 其中一把>
      金鑰存在平板 localStorage，網址上的 key 會自動清掉。
      Pi 位址預設讀 PocketBase settings.linePayServerUrl；要另外指定就加 ?pi=https://xxx
  ‧ XAI_API_KEY 只放在 Pi（/api/kiosk/voice/token 只發 2 分鐘短效 token），平板拿不到永久金鑰。
-->
<style>
:root{
  --green:#13503F;
  --green-deep:#0D3D30;
  --green-soft:#1C6A54;
  --yolk:#FFB000;
  --yolk-light:#FFD45C;
  --yolk-deep:#E68A00;
  --white:#FFFDF5;
  --ink:#23201B;
  --muted:#6B6457;
  --rule:#E3D9C2;
  --red:#D2261C;
  --toast:#C98A4B;
  --toast-crust:#9C5F27;
  --ask-bg:#FFEDB8;
  --ask-ink:#7A4600;
  font-size:clamp(16px,2.5vmin,30px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--green);
  color:var(--white);
  font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Source Han Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:.35rem solid var(--yolk-light);outline-offset:.3rem}
.screen{position:fixed;inset:0;display:none}
.screen.is-active{display:flex}

/* ───── 首頁 ───── */
.home{flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;padding:4vmin 4vmin 6vmin;text-align:center;overflow:hidden}
.home > *{position:relative;z-index:1}
.store-label{font-size:1.15rem;font-weight:700;opacity:.8;margin:0}
.greet{margin:0;font-size:3.3rem;font-weight:900;letter-spacing:.06em;line-height:1.1}
.egg{
  position:relative;border:0;background:none;padding:0;
  width:min(62vmin,600px);aspect-ratio:400/340;
  -webkit-tap-highlight-color:transparent;
}
.egg-white{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 1.3vmin 0 rgba(0,0,0,.2))}
.yolk{
  position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);
  width:58%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,var(--yolk-light) 0,var(--yolk) 46%,var(--yolk-deep) 100%);
  box-shadow:inset -1.2vmin -1.6vmin 0 rgba(200,110,0,.28);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vmin;
  color:var(--ink);
  animation:yolk-call 2.4s ease-in-out infinite;
  transition:transform .12s ease;
}
.yolk::after{content:"";position:absolute;left:20%;top:16%;width:20%;height:13%;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-28deg)}
.egg:active .yolk{transform:translate(-50%,-50%) scale(.95)}
.yolk-icon{width:9vmin;height:9vmin}
.yolk-text{font-size:7.2vmin;font-weight:900;letter-spacing:.08em;line-height:1}
@keyframes yolk-call{
  0%,100%{box-shadow:inset -1.2vmin -1.6vmin 0 rgba(200,110,0,.28),0 0 0 0 rgba(255,176,0,.55)}
  50%{box-shadow:inset -1.2vmin -1.6vmin 0 rgba(200,110,0,.28),0 0 0 3.2vmin rgba(255,176,0,0)}
}
.steps{list-style:none;margin:1vmin 0 0;padding:0;display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap;justify-content:center}
.steps li{display:flex;align-items:center;gap:.55rem;font-size:1.45rem;font-weight:800}
.steps li + li::before{content:"";width:2.4rem;border-top:.28rem dotted rgba(255,253,245,.55);margin-right:.8rem}
.step-no{display:inline-flex;align-items:center;justify-content:center;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--white);color:var(--green);font-size:1.25rem;font-weight:900}
.record-notice{margin:0;font-size:1.05rem;font-weight:700;opacity:.8}
.record-notice[hidden]{display:none}
body.is-paused .record-notice{display:none}
.home > .home-status{position:absolute;right:2.2vmin;top:1.6vmin;z-index:1;font-size:.8rem;opacity:.6;margin:0}
.paused-msg{display:none;margin:0;max-width:46rem;font-size:2.3rem;font-weight:900;line-height:1.35;color:var(--yolk)}
body.is-paused .paused-msg{display:block}
body.is-paused .steps{display:none}
body.is-paused .egg{filter:grayscale(.85);opacity:.5;pointer-events:none}
body.is-paused .yolk{animation:none}
.decor{position:absolute;z-index:0;pointer-events:none}
.decor-toast{left:-3vmin;bottom:-5vmin;width:26vmin;transform:rotate(-14deg)}
.decor-cup{right:-1vmin;bottom:-2vmin;width:22vmin}

/* ───── 點餐中 ───── */
.order{
  display:none;
  grid-template-columns:minmax(0,37fr) minmax(0,63fr);
  grid-template-rows:minmax(0,1fr) auto;
  grid-template-areas:"talk slip" "actions slip";
  gap:2.6vmin 3vmin;padding:3vmin;
}
.order.is-active{display:grid}
.talk{grid-area:talk;display:flex;flex-direction:column;gap:2.2vmin;min-height:0}
.status{
  align-self:flex-start;display:inline-flex;align-items:center;gap:.7rem;
  padding:.5rem 1.3rem .5rem .6rem;border-radius:999px;background:var(--green-deep);
  font-size:1.55rem;font-weight:900;
}
.status-dot{position:relative;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--yolk);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.status-dot svg{width:1.5rem;height:1.5rem}
.status[data-state="listening"] .status-dot::after{content:"";position:absolute;inset:0;border-radius:50%;border:.3rem solid var(--yolk);animation:ping 1.3s ease-out infinite}
.status[data-state="speaking"] .status-dot{background:var(--white)}
.status[data-state="thinking"] .status-dot,.status[data-state="connecting"] .status-dot{background:var(--green-soft);color:var(--white)}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(1.8);opacity:0}}
.clerk{display:flex;gap:1.2rem;align-items:flex-start}
.clerk-face{flex:none;width:4.2rem;height:4.2rem;border-radius:50%;background:radial-gradient(circle at 34% 30%,var(--yolk-light),var(--yolk) 55%,var(--yolk-deep));display:flex;align-items:center;justify-content:center}
.clerk-face svg{width:2.6rem;height:2.6rem}
.bubble{
  position:relative;flex:1;min-width:0;background:var(--white);color:var(--ink);
  border-radius:1.4rem;padding:1.1rem 1.4rem 1.2rem;
  font-size:1.8rem;font-weight:800;line-height:1.45;min-height:7.5rem;
}
.bubble::before{content:"";position:absolute;left:-.9rem;top:1.3rem;border:.6rem solid transparent;border-right:.9rem solid var(--white);border-left:0}
.bubble-who{display:block;font-size:1rem;font-weight:800;color:var(--muted);margin-bottom:.2rem}
.heard{margin:0;font-size:1.35rem;font-weight:600;line-height:1.5;color:rgba(255,253,245,.86);padding-left:5.4rem;min-height:2rem;word-break:break-all}
.heard strong{font-weight:900;color:var(--white);margin-right:.4rem}
.actions{grid-area:actions;display:grid;gap:1.6vmin}
.btn{border:0;border-radius:1.2rem;min-height:5rem;padding:.6rem 1rem;font-size:1.9rem;font-weight:900;letter-spacing:.06em}
.btn-done{background:var(--yolk);color:var(--ink);box-shadow:0 .7vmin 0 var(--yolk-deep)}
.btn-done:active{transform:translateY(.5vmin);box-shadow:0 .2vmin 0 var(--yolk-deep)}
.btn-cancel{background:transparent;color:var(--white);border:.3rem solid rgba(255,253,245,.55);min-height:4.2rem;font-size:1.5rem}
.btn-cancel.is-confirm{background:var(--red);border-color:var(--red)}
.mode-actions{display:none;grid-template-columns:1fr 1fr;gap:1.6vmin}
.mode-actions .btn{min-height:6rem;font-size:2.4rem}
.order.is-asking-mode .mode-actions{display:grid}
.order.is-asking-mode #btn-done{display:none}
.slip-mode{display:inline-block;margin-left:.8rem;padding:.1rem .7rem;border-radius:.5rem;background:var(--green);color:var(--white);font-size:1.1rem;letter-spacing:.1em;vertical-align:middle}
.slip-mode[hidden]{display:none}

/* 點餐單（紙條） */
.slip{
  grid-area:slip;position:relative;display:flex;flex-direction:column;min-height:0;
  background:var(--white);color:var(--ink);
  border-radius:.8rem .8rem 0 0;box-shadow:0 1.1vmin 0 rgba(0,0,0,.18);
  margin-bottom:1.2rem;
}
.slip::after{
  content:"";position:absolute;left:0;right:0;bottom:-1.1rem;height:1.2rem;
  background:linear-gradient(135deg,var(--white) 50%,transparent 50%) 0 0/1.4rem 1.2rem repeat-x,
             linear-gradient(225deg,var(--white) 50%,transparent 50%) 0 0/1.4rem 1.2rem repeat-x;
}
.slip-title{display:flex;justify-content:space-between;align-items:baseline;padding:1.1rem 1.6rem .4rem}
.slip-title h2{margin:0;font-size:1.6rem;font-weight:900;letter-spacing:.2em}
.slip-count{font-size:1.2rem;font-weight:700;color:var(--muted)}
.cols{display:grid;grid-template-columns:3.4rem minmax(0,1fr) 3.6rem 6.6rem;column-gap:.8rem;align-items:start}
.slip-head{padding:.5rem 1.6rem .6rem;border-bottom:.22rem solid var(--ink);font-size:1.1rem;font-weight:800;color:var(--muted)}
.slip-head .c-qty{text-align:center}
.slip-head .c-amt{text-align:right}
.rows{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.row{padding:1.05rem 1.6rem;border-bottom:.16rem dashed var(--rule)}
.row.is-new{animation:row-in 1.8s ease-out}
@keyframes row-in{0%{background:#FFE39A}100%{background:transparent}}
.r-no{font-size:1.6rem;font-weight:800;color:var(--muted);line-height:1.35}
.r-name{font-size:1.95rem;font-weight:900;line-height:1.3;word-break:break-all}
.r-opts{margin-top:.25rem;font-size:1.2rem;font-weight:700;color:var(--muted);line-height:1.45}
.r-ask{display:inline-block;margin-top:.45rem;padding:.12rem .7rem;border-radius:.5rem;background:var(--ask-bg);color:var(--ask-ink);font-size:1.15rem;font-weight:900}
.r-qty{font-size:1.95rem;font-weight:900;text-align:center;line-height:1.3}
.r-amt{font-size:1.95rem;font-weight:900;text-align:right;color:var(--red);line-height:1.3;font-variant-numeric:tabular-nums}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;color:var(--muted);text-align:center;padding:2rem}
.empty svg{width:7rem;height:6rem;opacity:.9}
.empty p{margin:0;font-size:1.55rem;font-weight:800;line-height:1.5}
.slip-foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.6rem 1.1rem;border-top:.45rem double var(--ink)}
.total-label{font-size:2.1rem;font-weight:900;letter-spacing:.2em}
.total{font-size:4.4rem;font-weight:900;color:var(--red);line-height:1;font-variant-numeric:tabular-nums}
.total small{font-size:.5em;margin-right:.1em}

/* ───── 點好了 ───── */
.done{display:none;grid-template-columns:minmax(0,42fr) minmax(0,58fr);grid-template-areas:"msg slip";gap:3vmin;padding:4vmin}
.done.is-active{display:grid}
.done-msg{grid-area:msg;display:flex;flex-direction:column;justify-content:center;gap:2.4vmin}
.done-msg h2{margin:0;font-size:3.6rem;font-weight:900;letter-spacing:.06em}
.done-total{margin:0;font-size:2rem;font-weight:800}
.done-total b{display:block;font-size:6.2rem;line-height:1;color:var(--yolk);font-variant-numeric:tabular-nums}
.done-go{margin:0;font-size:2.4rem;font-weight:900;line-height:1.35}
.done-actions{display:flex;flex-wrap:wrap;gap:1rem}
.done-actions .btn{min-width:13rem}
.done-actions .btn[hidden]{display:none}
.done-no{margin:0;font-size:2rem;font-weight:800}
.done-no b{display:block;font-size:8rem;line-height:.95;color:var(--yolk);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.done.has-no .done-msg{gap:1.6vmin}
.done.has-no .done-msg h2{font-size:2.6rem}
.done.has-no .done-no b{font-size:7rem}
.done.has-no .done-total{font-size:2.2rem}
.done.has-no .done-total b{display:inline;margin-left:.5rem;font-size:3.2rem;color:var(--white)}
.done.has-no .done-go{font-size:2.1rem}
.done-count{margin:0;font-size:1.1rem;opacity:.75}
.done .slip{grid-area:slip}
.done .r-name,.done .r-qty,.done .r-amt{font-size:1.6rem}

/* ───── 錯誤 ───── */
.error{flex-direction:column;align-items:center;justify-content:center;gap:2.4vmin;padding:6vmin;text-align:center}
.error h2{margin:0;font-size:3rem;font-weight:900}
.error-why{margin:0;font-size:1.6rem;font-weight:700;opacity:.85}
.error-do{margin:0;font-size:2.3rem;font-weight:900;color:var(--yolk)}
.error-diag{margin:0;font-size:1rem;opacity:.7}
.error-diag:empty{display:none}
/* 完整指示（唯讀）：manage「語音點餐」→ 查看完整指示 */
.prompt-view{flex-direction:column;gap:1.4rem;padding:2rem max(1rem,4vmin) 3rem;overflow-y:auto;background:var(--green-deep)}
.prompt-view h2{margin:0;font-size:1.8rem;font-weight:900}
.prompt-meta{margin:0;font-size:1rem;line-height:1.7;opacity:.85;white-space:pre-line}
.prompt-view h3{margin:.6rem 0 0;font-size:1.2rem;font-weight:900;color:var(--yolk)}
.prompt-view pre{margin:0;padding:1.2rem 1.4rem;border-radius:.9rem;background:var(--white);color:var(--ink);font:inherit;font-size:1rem;line-height:1.75;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.error .btn{min-width:15rem;margin-top:1vmin}

.demo-badge{display:none;position:fixed;left:50%;top:1.4vmin;transform:translateX(-50%);z-index:50;background:var(--yolk);color:var(--ink);font-size:.95rem;font-weight:900;padding:.3rem 1rem;border-radius:999px;box-shadow:0 .3rem 0 rgba(0,0,0,.2)}
body.is-demo #screen-home.is-active ~ .demo-badge{display:block}
.demo-chip{display:none;margin-left:.8rem;padding:.2rem .7rem;border-radius:999px;background:var(--yolk);color:var(--ink);font-size:.9rem;font-weight:900;vertical-align:middle}
body.is-demo .demo-chip{display:inline-block}
.talk-top{display:flex;align-items:center;flex-wrap:wrap;gap:.6rem}

/* 直立平板 */
@media (max-aspect-ratio:1/1){
  .order{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"talk" "slip" "actions"}
  .actions{grid-template-columns:2fr 1fr}
  .btn-cancel{min-height:5rem}
  .done{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"msg" "slip"}
  .egg{width:min(78vmin,600px)}
  .yolk-text{font-size:8.6vmin}
  .greet{font-size:3.8rem}
  .steps{flex-direction:column;align-items:flex-start;gap:1rem;margin-top:2vmin}
  .steps li{font-size:1.6rem}
  .steps li + li::before{display:none}
  .step-no{width:2.5rem;height:2.5rem;font-size:1.35rem}
  .decor-toast{width:30vmin}
  .decor-cup{width:26vmin}
}
@media (prefers-reduced-motion:reduce){
  .yolk,.status[data-state="listening"] .status-dot::after,.row.is-new{animation:none}
}
</style>
</head>
<body>

<!-- 首頁 -->
<section id="screen-home" class="screen home is-active" aria-label="開始點餐">
  <p id="store-label" class="store-label" hidden></p>
  <h1 id="greet" class="greet">早安！</h1>
  <button id="btn-start" class="egg" type="button" aria-label="開始點餐">
    <svg class="egg-white" viewBox="0 0 400 340" aria-hidden="true">
      <path fill="#FFFDF5" d="M196 10c52-3 98 14 132 40 40 30 62 62 66 104 4 40-10 70-30 98-24 34-62 66-116 76-48 9-96 6-138-12C66 300 30 270 14 228 0 190 4 150 22 116 40 82 66 54 102 34 132 18 162 12 196 10z"/>
    </svg>
    <span class="yolk">
      <svg class="yolk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/></svg>
      <span class="yolk-text">開始點餐</span>
    </span>
  </button>
  <p id="paused-msg" class="paused-msg" role="status"></p>
  <ol class="steps">
    <li><span class="step-no">1</span><span class="step-text">按蛋黃開始</span></li>
    <li><span class="step-no">2</span><span class="step-text">說出想吃的餐點</span></li>
    <li><span class="step-no">3</span><span class="step-text">到櫃台結帳</span></li>
  </ol>
  <p id="record-notice" class="record-notice" hidden></p>
  <p id="home-status" class="home-status"></p>
  <svg class="decor decor-toast" viewBox="0 0 200 200" aria-hidden="true">
    <path fill="#9C5F27" d="M38 178V86C14 80 8 56 20 38 34 16 66 8 100 8s66 8 80 30c12 18 6 42-18 48v92z"/>
    <path fill="#F2D19A" d="M52 166V80c-18-6-22-22-14-34 10-16 34-24 62-24s52 8 62 24c8 12 4 28-14 34v86z"/>
    <ellipse cx="100" cy="108" rx="34" ry="30" fill="#FFFDF5"/>
    <circle cx="102" cy="106" r="15" fill="#FFB000"/>
  </svg>
  <svg class="decor decor-cup" viewBox="0 0 200 200" aria-hidden="true">
    <path d="M70 34c-8 10 8 18 0 30M100 26c-8 12 8 20 0 34M130 34c-8 10 8 18 0 30" fill="none" stroke="#FFFDF5" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <ellipse cx="100" cy="176" rx="82" ry="16" fill="#0D3D30"/>
    <path fill="#FFFDF5" d="M36 80h128l-12 84c-2 10-10 16-20 16H68c-10 0-18-6-20-16z"/>
    <path d="M162 98c26-4 34 32 4 44" fill="none" stroke="#FFFDF5" stroke-width="12" stroke-linecap="round"/>
    <path fill="#C98A4B" d="M42 80h116l-2 14H44z"/>
  </svg>
</section>

<!-- 點餐中 -->
<section id="screen-order" class="screen order" aria-label="點餐中">
  <div class="talk">
    <div class="talk-top">
      <div id="status" class="status" data-state="connecting" role="status" aria-live="polite">
        <span class="status-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/></svg></span>
        <span id="status-text">接通中…</span>
      </div>
      <span class="demo-chip">預覽模擬</span>
    </div>
    <div class="clerk">
      <span class="clerk-face" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none" stroke="#23201B" stroke-width="3" stroke-linecap="round"><path d="M13 16v2M27 16v2"/><path d="M12 25c4 5 12 5 16 0"/></svg></span>
      <p id="agent-text" class="bubble" aria-live="polite"><span class="bubble-who">點餐員</span><span id="agent-line">正在幫您接通點餐員，請稍等…</span></p>
    </div>
    <p id="user-text" class="heard"></p>
  </div>
  <div class="actions">
    <div class="mode-actions">
      <button id="btn-mode-dinein" class="btn btn-done" type="button">內用</button>
      <button id="btn-mode-takeout" class="btn btn-done" type="button">外帶</button>
    </div>
    <button id="btn-done" class="btn btn-done" type="button">我點好了</button>
    <button id="btn-cancel" class="btn btn-cancel" type="button">取消重來</button>
  </div>
  <div class="slip" aria-label="點餐單">
    <div class="slip-title"><h2>點餐單<span id="order-mode" class="slip-mode" hidden></span></h2><span id="order-count" class="slip-count"></span></div>
    <div class="slip-head cols"><span>項次</span><span>餐點</span><span class="c-qty">數量</span><span class="c-amt">金額</span></div>

    var upd = function () {
      var left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      if (elId) $(elId).textContent = left + ' ' + suffix;
      if (left <= 0) goHome();
    };
    upd();
    homeTimer = setInterval(upd, 1000);
  }
  function setGreeting() {
    var h = new Date().getHours();
    $('greet').textContent = h < 11 ? '早安！' : (h < 17 ? '午安！' : '您好！');
  }
  function homeStatus() {
    var el = $('home-status');
    if (DEMO) { el.textContent = '預覽模式　菜單 ' + Menu.active.length + ' 項'; return; }
    if (Menu.error && !Menu.active.length) { el.textContent = '菜單載入失敗：' + Menu.error; return; }
    if (!storeGet('kiosk_voice_key')) { el.textContent = '尚未設定點餐金鑰（網址加 ?kioskKey=）'; return; }
    if (CONFIG.submitOrders && !(storeGet('kiosk_voice_device') && storeGet('kiosk_voice_sig'))) { el.textContent = '尚未完成平板安全註冊（manage → 店內平板安全註冊）'; return; }
    el.textContent = Menu.active.length ? ('菜單 ' + Menu.active.length + ' 項，已就緒' + (storeGet('kiosk_voice_device') ? '（' + storeGet('kiosk_voice_device') + '）' : '') + (CONFIG.submitOrders ? '' : '　試營運：點完不送單')) : '菜單載入中…';
  }

  /* ═════════ 載入菜單（正式） ═════════ */
  var dynImport = null;
  try { dynImport = new Function('u', 'return import(u)'); } catch (_) {}
  function loadLiveMenu() {
    if (!dynImport) { Menu.error = '瀏覽器太舊'; homeStatus(); return Promise.resolve(); }
    return dynImport(CONFIG.writerModule).then(function (W) {
      return Promise.resolve(W.readSettingsFromPocketBase({ timeoutMs: 4000 })).catch(function () { return {}; }).then(function (sr) {
        if (sr && sr.settings) Settings = sr.settings;
        if (usableSettings(sr)) applyVoiceSettings(Settings.kioskVoice);
        return W.listMenuItemsFromPocketBase({ settings: Settings, activeOnly: false, timeoutMs: 5000 });
      });
    }).then(function (res) {
      if (!res || !Array.isArray(res.items) || !res.items.length) throw new Error((res && (res.message || res.reason)) || 'menu_empty');
      setMenu(res.items, Settings.menu_alias || Settings.menuAlias);
      Menu.source = res.backend || 'pocketbase'; Menu.error = '';
    }).catch(function (e) {
      console.warn('[kiosk] menu load failed', e);
      Menu.error = String(e && e.message || e);
    }).then(homeStatus);
  }

  function usableSettings(sr) { return !!(sr && sr.settings && typeof sr.settings === 'object' && Object.keys(sr.settings).length); }
  function refreshSettings(timeoutMs) {
    if (DEMO || !dynImport) return Promise.resolve(false);
    return dynImport(CONFIG.writerModule).then(function (W) {
      return W.readSettingsFromPocketBase({ timeoutMs: timeoutMs || 4000 });
    }).then(function (sr) {
      if (!usableSettings(sr)) return false;
      Settings = sr.settings;
      applyVoiceSettings(Settings.kioskVoice);
      return true;
    }).catch(function () { return false; });
  }
  function renderHomeText() {
    var lis = document.querySelectorAll('#screen-home .steps .step-text');
    for (var i = 0; i < lis.length; i++) lis[i].textContent = CONFIG.homeSteps[i] || '';
    var rn = $('record-notice');
    rn.hidden = !(CONFIG.logAudio && !DEMO);
    rn.textContent = rn.hidden ? '' : '🎙️ ' + CONFIG.recordNotice;
  }
  function renderPaused() {
    var off = !DEMO && !VIEW_PROMPT && CONFIG.enabled === false;
    document.body.classList.toggle('is-paused', off);
    $('paused-msg').textContent = off ? CONFIG.pausedText : '';
    $('btn-start').setAttribute('aria-disabled', off ? 'true' : 'false');
  }

  /* ═════════ 完整指示（唯讀檢視）═════════ */
  function localTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso || '');
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function renderPromptView() {
    var voiceNote = Remote.voice ? CONFIG.voice : (CONFIG.voice + '（manage 沒選，實際以 Pi 的 XAI_VOICE_NAME 為準）');
    var meta = [
      DEMO ? '預覽菜單（離線）' : (Remote.loaded ? ('manage 設定' + (Remote.updatedAt ? '：' + localTime(Remote.updatedAt) + ' 存檔' : '')) : 'manage 還沒存過語音點餐設定，使用預設值'),
      '總開關：' + (CONFIG.enabled ? '開' : '暫停'),
      '今日菜單 ' + Menu.active.length + ' 項',
      '聲音 ' + voiceNote,
      '語速 ' + CONFIG.speechSpeed + ' 倍',
      '反應 ' + (CONFIG.reasoningEffort === 'high' ? '仔細' : '快'),
      '沉默 ' + Math.round(CONFIG.serverIdlePromptMs / 1000) + ' 秒主動問、' + Math.round(CONFIG.idleEndMs / 1000) + ' 秒沒聲音結束',
      '單次最長 ' + Math.round(CONFIG.maxSessionMs / 60000) + ' 分鐘',
      '問內用外帶：' + (CONFIG.askDineMode ? '要' : '不問'),
      '顧客插話：' + (CONFIG.bargeIn ? '可以（點餐員說話時也收音）' : '不行（點餐員說話時不收音）'),
      '停頓多久算講完：' + (CONFIG.vadSilenceMs ? (CONFIG.vadSilenceMs / 1000) + ' 秒' : 'xAI 預設') + '　收音門檻：' + (CONFIG.vadThreshold || 'xAI 預設'),
      '送單：' + (CONFIG.submitOrders ? '會送進 POS' : '試營運，不送單') + '　沒說點好了：' + (CONFIG.submitIncomplete ? '照樣送單（請店員確認）' : '不送單'),
      '音量 ' + CONFIG.volume + ' 倍　紀錄：' + (CONFIG.logText ? '對話文字' : '不存文字') + '、' + (CONFIG.logAudio ? '錄音' : '不錄音'),
      '首頁：' + CONFIG.homeSteps.join(' → ') + '　結尾：' + CONFIG.closingText
    ];
    $('prompt-meta').textContent = Menu.error && !Menu.active.length ? ('菜單載入失敗：' + Menu.error) : meta.join('\n');
    $('prompt-text').textContent = buildInstructions();
    $('prompt-terms').textContent = buildKeyterms(null).join('、');
  }

  /* ═════════ 綁定 ═════════ */
  var cancelArmed = 0;
  $('btn-start').addEventListener('click', function () {
    if (!CONFIG.enabled && !DEMO) { renderPaused(); return; }
    keepAwake();
    if (DEMO) startDemo(); else startLive();
  });
  $('btn-done').addEventListener('click', userPressedDone);
  $('btn-cancel').addEventListener('click', function () {
    var b = $('btn-cancel');
    if (!cancelArmed) {
      b.textContent = '再按一次確定取消'; b.classList.add('is-confirm');
      cancelArmed = later(4000, function () { cancelArmed = 0; b.textContent = '取消重來'; b.classList.remove('is-confirm'); });
      return;
    }
    clearTimeout(cancelArmed); cancelArmed = 0; b.textContent = '取消重來'; b.classList.remove('is-confirm');
    Session.endHint = 'cancelled';
    goHome();
  });
  $('btn-home').addEventListener('click', goHome);
  $('btn-retry').addEventListener('click', function () { submitOrder().catch(function () {}); });
  $('btn-mode-dinein').addEventListener('click', function () { pressDineMode('dinein'); });
  $('btn-mode-takeout').addEventListener('click', function () { pressDineMode('takeout'); });
  $('btn-error-home').addEventListener('click', goHome);

  var wakeLock = null;
  function keepAwake() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request && !wakeLock) {
        navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; l.addEventListener('release', function () { wakeLock = null; }); }).catch(function () {});
      }
    } catch (_) {}
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') keepAwake(); });

  /* ═════════ 啟動 ═════════ */
  if (CONFIG.storeLabel) { $('store-label').textContent = CONFIG.storeLabel; $('store-label').hidden = false; }
  setGreeting();
  renderOrder();
  if (window.speechSynthesis) { pickVoice(); try { window.speechSynthesis.onvoiceschanged = pickVoice; } catch (_) {} }
  if (VIEW_PROMPT) {
    showScreen('screen-prompt');
    if (DEMO) { setMenu(DEMO_MENU, null); renderPromptView(); }
    else loadLiveMenu().then(renderPromptView);
  } else if (DEMO) {
    document.body.classList.add('is-demo');
    setMenu(DEMO_MENU, null);
    homeStatus();
  } else {
    homeStatus();
    loadLiveMenu();
    setInterval(function () { if ($('screen-home').classList.contains('is-active')) loadLiveMenu(); }, CONFIG.menuRefreshMs);
    keepAwake();
  }

  // 測試用
  window.__kiosk = { runTool: runTool, findItem: findItem, setMenu: setMenu, Order: Order, Menu: Menu, buildInstructions: buildInstructions, buildKeyterms: buildKeyterms, sessionUpdate: sessionUpdate, CONFIG: CONFIG, Session: Session, goHome: goHome, showError: showError, goDone: goDone, Submit: Submit, buildOrderData: buildOrderData, speakName: speakName, submitOrder: submitOrder, businessWindow: businessWindow, applyVoiceSettings: applyVoiceSettings, refreshSettings: refreshSettings, Remote: Remote, renderPromptView: renderPromptView, choiceAsk: choiceAsk, Turn: Turn, resetOffers: resetOffers, Offers: Offers, Pending: Pending, handleEvent: handleEvent, Log: Log, Rec: Rec, AudioIO: AudioIO, tick: tick, renderHomeText: renderHomeText };
})();
</script>
</body>
</html>
