<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>LINE Pay 付款處理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Helvetica Neue",Arial,"PingFang TC","Microsoft JhengHei",sans-serif;
  background:#f5f5f5;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,.08);
  max-width:380px;width:calc(100% - 32px);padding:40px 28px;text-align:center}
.icon{font-size:56px;margin-bottom:16px}
.title{font-size:22px;font-weight:800;color:#333;margin-bottom:8px}
.msg{font-size:14px;color:#888;line-height:1.6;margin-bottom:24px}
.orderno{font-size:18px;font-weight:700;color:#06C755;background:#f0faf4;
  padding:8px 20px;border-radius:10px;display:inline-block;margin-bottom:20px}
.btn{display:inline-block;background:#06C755;color:#fff;font-weight:700;font-size:15px;
  padding:12px 32px;border-radius:12px;text-decoration:none;transition:.15s}
.btn:hover{background:#05b34c;transform:scale(1.02)}
.btn.cancel{background:#999}
.btn.cancel:hover{background:#777}
.spinner{width:48px;height:48px;border:4px solid #e5e5e5;border-top-color:#06C755;
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:#e53935}
</style>
</head>
<body>

<div class="card" id="app">
  <!-- 載入中 -->
  <div id="loading">
    <div class="spinner"></div>
    <p class="title">付款處理中...</p>
    <p class="msg">正在確認您的 LINE Pay 付款，請稍候</p>
  </div>

  <!-- 成功 -->
  <div id="success" style="display:none">
    <div class="icon">✅</div>
    <p class="title">付款成功！</p>
    <p class="msg">感謝您使用 LINE Pay 付款</p>
    <p class="msg" id="pickupTimeInfo" style="display:none;color:#333;font-weight:500;margin-bottom:4px;"></p>
    <p class="msg" id="orderTimeInfo" style="display:none;color:#333;font-weight:500;margin-bottom:8px;"></p>
    <p id="phoneReminder" style="display:none;font-size:18px;font-weight:900;color:#f97316;margin-bottom:20px;">取餐請告知電話末3碼</p>
    <a class="btn" id="backBtn" href="javascript:void(0)">返回點餐頁面</a>
    <a class="btn" id="closePosBtn" href="javascript:void(0)" style="display:none;margin-top:8px" onclick="try{window.close();}catch(e){}">可關閉此視窗</a>
  </div>

  <!-- 取消 -->
  <div id="cancelled" style="display:none">
    <div class="icon">🔙</div>
    <p class="title">付款已取消</p>
    <p class="msg">本筆 LINE Pay 已取消未付款<br>請返回原點餐頁查看訂單記錄</p>
    <a class="btn cancel" id="cancelBackBtn" href="javascript:void(0)">返回</a>
  </div>

  <!-- 錯誤 -->
  <div id="error" style="display:none">
    <div class="icon">⚠️</div>
    <p class="title error">付款處理異常</p>
    <p class="msg" id="errorMsg"></p>
    <a class="btn cancel" id="errorBackBtn" href="javascript:void(0)">返回</a>
</div>
<p class="msg" id="returnHelp" style="display:none"></p>
</div>

<script>
// 即使模組或網路載入失敗，也不能讓付款頁永久顯示旋轉動畫。
setTimeout(function () {
  const loading = document.getElementById('loading');
  if (!loading || loading.style.display === 'none') return;
  const spinner = loading.querySelector('.spinner');
  if (spinner) spinner.style.display = 'none';
  loading.querySelector('.title').textContent = '付款確認中';
  loading.querySelector('.msg').textContent =
    '付款結果將由後端繼續核對，請勿重複付款；您可以返回 LINE Pay 或關閉此頁。';
}, 15000);
</script>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-auth.js";
import { readLinePayStatusViaBackend, cancelOwnedOrderViaBackend } from "./pocketbase-order-writer.20260818_001.js?v=20260920_customer_status_hours_1";
import { markLinePayCheckoutOutcome, clearLinePayCheckoutHandoff } from "./linepay-checkout-handoff.20260912_001.js";

const firebaseConfig = {
  apiKey: "AIzaSyCQqI6p8e8-lxz3mOBRaWUPxyVES_83KBI",
  authDomain: "breakfast-ai-system.firebaseapp.com",
  databaseURL: "https://breakfast-ai-system-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "breakfast-ai-system",
  storageBucket: "breakfast-ai-system.firebasestorage.app"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// ── 解析 URL 參數 ──
const params = new URLSearchParams(window.location.search);
const orderId = params.get('orderId');
const action = params.get('action');           // confirm 或 cancel
const transactionId = params.get('transactionId');
const callbackToken = params.get('callbackToken') || '';
const callbackAmount = Number(params.get('amount') || 0);
const callbackOrderDateKey = params.get('orderDateKey') || '';
const returnPage = params.get('returnPage') || '';

function showView(id) {
  ['loading', 'success', 'cancelled', 'error'].forEach(v => {
    document.getElementById(v).style.display = v === id ? 'block' : 'none';
  });
}

function safeStorageGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function safeStorageRemove(key) {
  try { localStorage.removeItem(key); } catch (e) {}
}
function waitForExistingIdToken(timeoutMs = 5000) {
  if (auth.currentUser) return auth.currentUser.getIdToken().catch(() => '');
  return new Promise(resolve => {
    let settled = false;
    let unsubscribe = () => {};
    let timer = null;
    const finish = value => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      unsubscribe();
      resolve(value || '');
    };
    timer = setTimeout(() => finish(''), timeoutMs);
    unsubscribe = onAuthStateChanged(auth, user => {
      if (!user) return;
      user.getIdToken().then(finish).catch(() => finish(''));
    }, () => finish(''));
  });
}
function firebaseRestUrl(baseUrl, path, idToken) {
  const url = new URL(`${baseUrl}/${path.replace(/^\/+/, '')}.json`);
  if (idToken) url.searchParams.set('auth', idToken);
  return url.toString();
}
function showConfirmationPending() {
  document.getElementById('success').querySelector('.icon').textContent = '⏳';
  document.getElementById('success').querySelector('.title').textContent = '付款結果同步中';
  document.getElementById('success').querySelector('.msg').textContent =
    '目前尚未取得最終結果，不代表付款失敗。系統仍會核對本筆付款，請勿重新下單或重複付款；可返回原點餐頁查看訂單記錄。';
  document.getElementById('phoneReminder').style.display = 'none';
  showView('success');
}
function getBackUrl() {
  const urlParams = new URLSearchParams(window.location.search);
  const returnPage = urlParams.get('returnPage');
  const deviceId = urlParams.get('deviceId');
  const base = window.location.pathname.replace(/\/[^/]*$/, '/');
  const rawDevice = String(deviceId || '').trim();
  let decodedDevice = '';
  if (rawDevice) {
    try { decodedDevice = decodeURIComponent(rawDevice); } catch (e) { decodedDevice = rawDevice; }
  }

  // 電話端防呆：即使 returnPage 被舊版誤填成 pos/admin，只要 deviceId 已是 dashboard URL 仍優先返回電話主頁
  if (decodedDevice && /^https?:\/\//i.test(decodedDevice) && /:1880\/dashboard\//i.test(decodedDevice)) {
    return decodedDevice;
  }

  if (returnPage === 'pos') return base + 'pos.html';
  if (returnPage === 'admin') return base + 'admin.html';

  if (returnPage === 'dinein') {
    // Keep the original signed phone URL across refreshes. Never turn a phone
    // callback into a tablet pairing URL when browser storage is unavailable.
    const storedDinein = safeStorageGet('dinein_linepay_url_' + orderId);
    if (storedDinein) {
      try {
        const original = new URL(storedDinein);
        const table = original.searchParams.get('table');
        const takeout = original.searchParams.get('takeout');
        const expected = table && !takeout ? 'table_' + table : takeout && !table ? 'takeout_' + takeout : '';
        if (original.origin === window.location.origin && original.pathname === base + 'dinein.html' &&
            /^(table|takeout)_\d+$/.test(expected) && expected === deviceId &&
            /^[a-f0-9]{64}$/i.test(original.searchParams.get('sig') || '')) return original.href;
      } catch (e) {}
    }
    return '';
  }

  if (returnPage === 'phone') {
    if (decodedDevice) {
      if (/^https?:\/\//i.test(decodedDevice)) return decodedDevice;
      if (/^\/[^/]/.test(decodedDevice)) return decodedDevice;
    }
  }

  if (returnPage === 'index') return base + 'index.html';

  const stored = safeStorageGet('linepay_return_url');
  if (stored) {
    safeStorageRemove('linepay_return_url');
    return stored;
  }
  return base + 'index.html';
}

async function reconcileDineinCancellationReturn() {
  // Cross-device QR callbacks may not own this order. Do not mutate it or claim
  // cancellation from the query string; let the owner page reconcile the original transaction.
  try {
    const token = await waitForExistingIdToken();
    if (!token) throw new Error('owner_session_unavailable');
    const result = await readLinePayStatusViaBackend(orderId, {firebaseUser: auth.currentUser, timeoutMs: 5000});
    if (showTerminalPayment(result)) return;
    if (paymentOutcome(result) === 'paid') {
      clearLinePayCheckoutHandoff(orderId);
      showView('success');
    } else {
      throw new Error('cancellation_not_confirmed');
    }
  } catch (e) {
    document.getElementById('success').querySelector('.icon').textContent = '⏳';
    document.getElementById('success').querySelector('.title').textContent = '已離開 LINE Pay 付款頁';
    document.getElementById('success').querySelector('.msg').textContent = '取消結果仍在確認中。請返回原點餐頁查看本筆訂單，勿重新下單或重複付款；若狀態未更新，請店員協助。';
    showView('success');
  }
}

function paymentOutcome(result) {
  const payment = result && result.order || {};
  const status = String(result && result.status || '').toLowerCase();
  if (status === 'refunded' || payment.paymentStatus === 'refunded') return 'refunded';
  if (status === 'confirmed' || payment.paymentStatus === 'paid') {
    return payment.status === 'cancelled' || payment.wasCancelled ? 'refund_pending' : 'paid';
  }
  if (status === 'cancelled') return 'cancelled';
  if (['confirm_failed','request_failed','failed','error'].includes(status) ||
      ['confirm_failed','request_failed','failed','error'].includes(payment.paymentStatus)) return 'failed';
  if (payment.status === 'cancelled' || (payment.status === 'archived' && payment.wasCancelled && payment.paymentStatus === 'unpaid')) return 'cancelled';
  return '';
}
function showTerminalPayment(result) {
  const outcome = paymentOutcome(result);
  if (!outcome || outcome === 'paid') return false;
  if (outcome === 'cancelled') {
    markLinePayCheckoutOutcome(orderId, 'cancelled');
    showView('cancelled');
  } else if (outcome === 'failed') {
    markLinePayCheckoutOutcome(orderId, 'failed');
    const detail = String(result.error || '');
    document.getElementById('error').querySelector('.title').textContent = '本次付款未完成';
    document.getElementById('errorMsg').textContent = /\b1288\b/.test(detail)
      ? 'LINE Pay 回覆：信用卡帳戶餘額不足（1288）。請向發卡銀行確認，或改用其他付款方式。'
      : 'LINE Pay 回覆本次付款未完成，請返回原點餐頁查看本筆訂單記錄。';
    showView('error');
  } else {
    document.getElementById('success').querySelector('.icon').textContent = outcome === 'refunded' ? '💜' : '⏳';
    document.getElementById('success').querySelector('.title').textContent = outcome === 'refunded' ? 'LINE Pay 已退款' : '訂單已取消，退款確認中';
    document.getElementById('success').querySelector('.msg').textContent = '請返回原點餐頁查看本筆訂單記錄';
    showView('success');
  }
  return true;
}
async function boundedFetch(url, options = {}) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 5000);
  try { return await fetch(url, {...options, signal: controller.signal}); }
  finally { clearTimeout(timer); }
}

async function processPayment() {
  if (!orderId) {
    document.getElementById('errorMsg').textContent = '缺少訂單編號';
    showView('error');
    return;
  }

  // A navigation hint only: never use the return URL as proof of a payment outcome.
  // On the original phone, prevent refresh from opening the same payment URL again.
  if (returnPage === 'dinein') {
    try { localStorage.setItem('dinein_linepay_return_' + orderId, '1'); } catch (e) {}
  }

  // 設定返回按鈕
  const backUrl = getBackUrl();
  const isPosClose = (backUrl === '__close__');
  if (isPosClose) {
    document.getElementById('backBtn').style.display = 'none';
    document.getElementById('closePosBtn').style.display = 'inline-block';
    document.getElementById('cancelBackBtn').href = 'javascript:try{window.close();}catch(e){}';
    document.getElementById('errorBackBtn').href = 'javascript:try{window.close();}catch(e){}';
  } else if (!backUrl) {
    ['backBtn','cancelBackBtn','errorBackBtn'].forEach(id => {document.getElementById(id).style.display = 'none';});
    const help = document.getElementById('returnHelp');
    help.textContent = '此瀏覽器沒有原點餐頁的安全連結。請切回原本點餐的瀏覽器查看本筆訂單記錄，勿重新下單或重複付款。訂單查詢編號：' + orderId;
    help.style.display = 'block';
  } else {
    document.getElementById('backBtn').href = backUrl;
    document.getElementById('cancelBackBtn').href = backUrl;
    document.getElementById('errorBackBtn').href = backUrl;
  }

  // ── 取消 ──
  if (action === 'cancel') {
    if (returnPage === 'dinein') return reconcileDineinCancellationReturn();
    // dinein/phone 的付款頁可能開在另一支手機，沒有原下單裝置的 Firebase 身分；
    // 它們維持既有流程，由原裝置的狀態輪詢／取消按鈕收尾。
    if (!['index', 'pos', 'admin'].includes(returnPage)) {
      showView('cancelled');
      return;
    }
    // 必須先由後端撤回未付款訂單，才允許原頁恢復購物車。
    try {
      const idToken = await waitForExistingIdToken();
      if (!idToken || !auth.currentUser) throw new Error('登入狀態已失效');
      await cancelOwnedOrderViaBackend(orderId, {
        firebaseUser: auth.currentUser,
        timeoutMs: 10000
      });
      markLinePayCheckoutOutcome(orderId, 'cancelled');
      showView('cancelled');
    } catch (e) {
      document.getElementById('errorMsg').textContent = '取消尚未完成，請勿重複下單，並請店員協助確認：' + (e.message || e);
      showView('error');
    }
    return;
  }

  // ── 確認付款 ──
  try {
    const txnId = String(transactionId || '').trim();
    const amount = callbackAmount;
    const orderDateKey = callbackOrderDateKey;
    const _dbUrl = 'https://breakfast-ai-system-default-rtdb.asia-southeast1.firebasedatabase.app';

    const callbackMetadataComplete =
      !!txnId && Number.isFinite(amount) && amount > 0 &&
      /^[a-f0-9]{32}$/i.test(callbackToken) &&
      /^\d{4}-\d{2}-\d{2}$/.test(orderDateKey);

    // callbackToken 是建立交易時由後端產生的一次性能力憑證；
    // Firebase 規則會同時核對交易編號、金額與日期。
    const dbRestUrl = 'https://breakfast-ai-system-default-rtdb.asia-southeast1.firebasedatabase.app';
    const idToken = await waitForExistingIdToken();
    if (!idToken) {
      showConfirmationPending();
      return;
    }
    let confirmed = false;
    // A lost callback response is not a declined payment. Read the existing
    // transaction first, including reloads where callback metadata was removed.
    try {
      const existing = await readLinePayStatusViaBackend(orderId, {firebaseIdToken: idToken, timeoutMs: 5000});
      if (showTerminalPayment(existing)) return;
      confirmed = paymentOutcome(existing) === 'paid';
    } catch (e) { /* Owner-checked reads may recover in the bounded polling below. */ }
    let writeOk = false;
    for (let retry = 0; !confirmed && callbackMetadataComplete && retry < 3; retry++) {
      try {
        const wRes = await boundedFetch(firebaseRestUrl(dbRestUrl, `linepay_confirms/${orderId}`, idToken), {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            transactionId: String(txnId),
            amount: Number(amount),
            orderId: orderId,
            orderDateKey: orderDateKey,
            callbackToken: callbackToken,
            status: 'pending',
            timestamp: Date.now()
          })
        });
        if (!wRes.ok) throw new Error('HTTP ' + wRes.status);
        writeOk = true;
        break;
      } catch(e) {
        console.error('寫入 confirms 失敗(retry '+retry+'):', e);
        await new Promise(r => setTimeout(r, 1000));
      }
    }

    // Retain order identity on refresh, remove the one-time callback capability.
    if (writeOk || confirmed) try {
      const clean = new URLSearchParams(window.location.search);
      ['callbackToken','amount','transactionId'].forEach(key => clean.delete(key));
      history.replaceState(null, '', window.location.pathname + '?' + clean.toString());
    } catch (e) {}

    for (let i = 0; i < 9; i++) {
      if (confirmed) break;
      await new Promise(r => setTimeout(r, 6500));
      try {
        const statusResult = await readLinePayStatusViaBackend(orderId, {
          firebaseIdToken: idToken,
          timeoutMs: 5000
        });
        if (showTerminalPayment(statusResult)) return;
        if (paymentOutcome(statusResult) === 'paid') { confirmed = true; break; }
      } catch(e) { /* 繼續等待 */ }
    }

    if (confirmed) {
      clearLinePayCheckoutHandoff(orderId);
      document.getElementById('success').querySelector('.icon').textContent = '✅';
      document.getElementById('success').querySelector('.title').textContent = '付款成功！';
      document.getElementById('success').querySelector('.msg').textContent = '本筆 LINE Pay 已付清，請勿重複付款';
      showView('success');
      try {
        const orderPath = `orders/${orderDateKey}/${orderId}`;
        const orderRes = await boundedFetch(firebaseRestUrl(_dbUrl, orderPath, idToken));
        const orderData = await orderRes.json();
        if (orderData) {
          const dayNames = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
          if (orderData.pickupDate || orderData.pickupTime) {
            let pickupStr = '';
            if (orderData.pickupDate) {
              const pd = new Date(orderData.pickupDate + 'T00:00:00');
              pickupStr = `${pd.getFullYear()}/${String(pd.getMonth()+1).padStart(2,'0')}/${String(pd.getDate()).padStart(2,'0')}(${dayNames[pd.getDay()]}) ${orderData.pickupTime || ''}`;
            } else { pickupStr = orderData.pickupTime || ''; }
            const el = document.getElementById('pickupTimeInfo');
            el.textContent = '取餐時間：' + pickupStr; el.style.display = 'block';
          }
          if (orderData.timestamp) {
            const od = new Date(orderData.timestamp);
            const el2 = document.getElementById('orderTimeInfo');
            el2.textContent = '下單時間：' + `${od.getFullYear()}/${String(od.getMonth()+1).padStart(2,'0')}/${String(od.getDate()).padStart(2,'0')} ${String(od.getHours()).padStart(2,'0')}:${String(od.getMinutes()).padStart(2,'0')}`;
            el2.style.display = 'block';
          }
        }
      } catch(e) { console.error(e); }
      document.getElementById('phoneReminder').style.display = returnPage === 'dinein' ? 'none' : 'block';
      showView('success');
      if (returnPage === 'pos') {
        window.location.replace(backUrl);
        return;
      }
      if (isPosClose) { setTimeout(function(){ try{window.close();}catch(e){} }, 3000); }
    } else {
      showConfirmationPending();
    }

  } catch (e) {
    console.error('付款處理異常:', e);
    showConfirmationPending();
  }
}

// 啟動
processPayment();
</script>

</body>
</html>
